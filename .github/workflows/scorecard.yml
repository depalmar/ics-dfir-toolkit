name: scorecard

# OpenSSF Scorecard measures this repository against supply-chain practice:
# token permissions, pinned dependencies, branch protection, dependency-update
# tooling, a security policy, static analysis. It reads and changes nothing.
# Findings appear under Security > Code scanning; the published score is at
# https://securityscorecards.dev/viewer/?uri=github.com/depalmar/ics-dfir-toolkit

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'    # Mondays 05:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish the score (the badge reads it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
