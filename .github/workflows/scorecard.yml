name: scorecard

# OpenSSF Scorecard measures this repository against supply-chain practice:
# token permissions, pinned dependencies, branch protection, dependency-update
# tooling, a security policy, static analysis. It reads and changes nothing.
# Findings appear under Security > Code scanning; the published score is at
# https://securityscorecards.dev/viewer/?uri=github.com/depalmar/ics-dfir-toolkit

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'    # Mondays 05:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish the score (the badge reads it)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46 # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: results.sarif
