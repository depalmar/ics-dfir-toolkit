  - locator: Program Compare setting (status bit S:2/9) and the memory module's stored program
    class: integrity
    volatility: stable
    forensic_value: medium
    evidence_type: [impair-process-control, configuration]
    confidence: high
    collection_impact: online-vendor-tool
    description: >-
      Where Program Compare was enabled with a write-protected module, the
      controller should refuse to run a program that differs from the module's
      (vendor behaviour); whether a mismatch was ever hit is not logged in any
      source read.
    provides: A hardware-held copy of the approved program and a run-time gate on changes.
    normal: S:2/9 set and a write-protected module holding the approved program, where the site uses it.
    suspicious: S:2/9 cleared on a controller documented as using it; a controller that will not enter run after a mode change (possible mismatch).
    basis: vendor
  - locator: LCD Fault Code and System Information screens (operating system series, firmware version)
    class: diagnostics
    volatility: live
    forensic_value: medium
    evidence_type: [impact, configuration]
    confidence: high
    collection_impact: read-only
    description: The current fault code, if any, and the firmware the controller runs.
    provides: Whether the controller faulted, and whether its firmware matches the register.
    normal: No fault code; firmware revision as recorded in the asset register.
    suspicious: A fault after an unexplained configuration change; a firmware revision that differs from the register.
    basis: vendor
    sources:
