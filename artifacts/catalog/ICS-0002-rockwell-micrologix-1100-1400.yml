# ICS platform catalog entry
# ICS-0002 - Rockwell Automation MicroLogix 1100 / 1400
# Research notes: docs/research/2026-11-08/platforms-round2.md

id: ICS-0002
name: Rockwell Automation MicroLogix 1100 / 1400
vendor: Rockwell Automation
products:
  - MicroLogix 1400 (1766-L32 catalog numbers, Series A, B and C)
  - MicroLogix 1100 (1763-L16 catalog numbers, Series A, B and C)
asset_class: plc
purdue_levels: ["1"]
protocols: [ICS-PROTO-0004, ICS-PROTO-0005, ICS-PROTO-0001, ICS-PROTO-0006]
os_base: >-
  Proprietary controller operating system; the series and firmware revision
  (FRN) are shown on the MicroLogix 1400 LCD System Information screen.
  Internals are not published.
filesystem: >-
  No customer-visible filesystem. Program and data are non-volatile in the
  controller. An optional 1766-MM1 memory module (MicroLogix 1400) holds one
  user program with data, datalog and recipe as a separate backup.
customer_shell: "no"
memory_acquisition: not-available
program_access: vendor-software-upload
operating_modes: >-
  On the MicroLogix 1400 the mode switch is a screen on the LCD with
  positions PROGRAM, REMOTE and RUN; every LCD screen except the boot message
  shows the current position at top right. REMOTE allows remote program,
  download, run and test modes. No source read documents any record of a mode
  change on the controller. FBI and Rockwell recommend leaving it in RUN
  except while downloading.
integrity_features:
  - feature: Memory module Program Compare (status bit S:2/9)
    description: >-
      When enabled, the controller will not enter run or test mode if the
      program in the memory module differs from the program in the
      controller. A memory module can also be made permanently write-protected
      ("write-once, read-many"), which keeps a fixed copy of the approved
      program. Both must have been set up before an incident.
    versions: MicroLogix 1400 with 1766-MM1 (MicroLogix 1100 not read)
    confidence: high
    sources:
      - title: MicroLogix 1400 Programmable Controllers User Manual (1766-UM001P-EN-P, March 2024)
        url: https://literature.rockwellautomation.com/idc/groups/literature/documents/um/1766-um001_-en-p.pdf
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          The memory module can also provide application security, allowing
          you to specify that if the program stored in the memory module does
          not match the program in the controller, the controller will not enter
          an executing (run or test) mode.
        read: direct
      - title: MicroLogix 1400 Programmable Controllers User Manual (1766-UM001P-EN-P, March 2024)
        url: https://literature.rockwellautomation.com/idc/groups/literature/documents/um/1766-um001_-en-p.pdf
        accessed: "2026-11-08"
        kind: vendor
        quote: Once set, write protection cannot be removed.
        read: direct
  - feature: Controller password, LCD password and Enhanced Password Security
    description: >-
      A controller password protects program access; from firmware FRN 21 the
      MicroLogix 1400 LCD has a Security menu with its own LCD password.
      Rockwell's SD1790 asks MicroLogix 1400 Series B owners to apply FRN
      21.002 or later and enable Enhanced Password Security. A password is
      access control, not an audit record: no source read describes the
      controller logging when one is set or changed.
    versions: LCD password FRN 21 and later; Enhanced Password Security on Series B FRN 21.002 and later
    confidence: high
    sources:
      - title: Rockwell Automation SD1790 - Important Hardening Guidance ... Restoring Access When the Password Is Unknown (rev. 5.0)
        url: https://www.rockwellautomation.com/en-us/trust-center/security-advisories/advisory.SD1790.html
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          On MicroLogix™ 1400 Series B, apply firmware FRN 21.002 or later and
          enable Enhanced Password Security.
        read: direct
collection:
  - method: Logs already held by the cellular modem, firewall or remote-access gateway in front of the PLC
    impact: passive
    description: >-
      The only record of who connected, since no on-controller log is
      documented. FBI asks owners to enable and review modem logs; CISA warns
      the modems are often undocumented integrator or vendor installs.
    confidence: high
    references:
      - https://www.ic3.gov/PSA/2026/PSA260730.pdf
      - https://www.cisa.gov/news-events/alerts/2026/07/30/cisa-urges-water-and-wastewater-systems-sector-protect-ot-against-activity-targeting-plcs
  - method: Passive capture of EtherNet/IP (PCCC), Modbus TCP, DNP3 and HTTP traffic to the PLC (TAP or SPAN)
    impact: passive
    description: >-
      Shows the sessions that changed configuration or logic and the
      addresses they came from, independent of the controller.
    confidence: medium
  - method: Collect the offline project (.RSS) backups and any memory module taken before the incident
    impact: passive
    description: >-
      The known-good reference for comparison and the only way to restore
      after a password lockout. Establish when each backup was taken and that
      it predates the compromise.
    confidence: high
    references:
      - https://www.rockwellautomation.com/en-us/trust-center/security-advisories/advisory.SD1790.html
  - method: Read and photograph the MicroLogix 1400 LCD - mode position, ENET Cfg Status (MAC and IP), Fault Code, System Information
    impact: read-only
    description: >-
      Main Menu → Advanced Set → ENET Cfg → Status shows the MAC and IP
      addresses; Advanced Set also leads to the Fault Code and System
      Information (operating system series and firmware version) screens.
      Needs someone at the cabinet, no network session.
    safety_note: >-
      The mode switch is itself an LCD screen and the IP address is editable
      from the same ENET Cfg menu. Navigate only to the status, fault-code and
      system-information screens; do not open the Mode Switch, IP Address or
      Security screens. Agree the visit with operations.
    confidence: high
    references:
      - https://literature.rockwellautomation.com/idc/groups/literature/documents/um/1766-um001_-en-p.pdf
  - method: View the MicroLogix 1400 embedded web server (module information, TCP/IP configuration, diagnostics)
    impact: read-only
    description: >-
      A browser view of configuration and diagnostics. Only if the web server
      was already enabled; Rockwell advises disabling it when not required, so
      do not enable it now.
    safety_note: >-
      Firmware since FRN3 supports writing data files through the web server;
      view only, and do not use data-table write pages.
    confidence: high
    references:
      - https://literature.rockwellautomation.com/idc/groups/literature/documents/um/1766-um001_-en-p.pdf
  - method: Upload the running program with RSLogix 500 / RSLogix Micro into a new file and compare it with the known-good .RSS
    impact: online-vendor-tool
    description: >-
      The logic is the primary artifact; FBI asks owners to compare the running
      program with known-good logic. Not possible when an unknown password has
      been set, which is what the July 2026 campaign did.
    safety_note: >-
      The same session can download, change mode or change the IP address.
      Operations approval required; upload into a new, empty project so the
      investigator's copy cannot be downloaded by mistake.
    confidence: high
    references:
      - https://www.ic3.gov/PSA/2026/PSA260730.pdf
volatility:
  - >-
    Rockwell's SD1790 recovery for an unknown password erases the evidence: on
    the MicroLogix 1400, battery removal clears program, data and IP
    configuration; on the 1100, a firmware update over DF1 serial clears the
    user program and the password. SD1790 (rev. 5.0, read directly at
    integration on 2026-11-08): "The IP address and program are now erased" and
    "The firmware update process will clear the user program and any configured
    controller password, restoring access to the device." Capture everything
    else first, and keep a record that the attacker's logic could not be
    uploaded.
  - >-
    No on-controller audit or event log is documented in the sources read. An
    IP or password change leaves no record on the PLC that this project could
    find; network capture and modem logs are the event record.
  - The LCD fault code is not shown automatically; only the FAULT LED flashes until someone opens the Fault Code screen.
anti_forensics:
  - technique: Password turned on and set where none existed, locking owners out of program upload
    seen_in: US water-sector MicroLogix campaign, July 2026 (FBI/EPA I-073026-PSA; Rockwell SD1790)
    detail: >-
      Besides denying control, the lockout prevents uploading the modified
      logic for comparison, and the vendor's recovery erases it.
  - technique: Controller IP address changed, disconnecting the PLC from HMI and SCADA
    seen_in: US water-sector MicroLogix campaign, July 2026 (FBI/EPA I-073026-PSA)
datasources: [ICS-DS-0001, ICS-DS-0002, ICS-DS-0003, ICS-DS-0004, ICS-DS-0012, ICS-DS-0014, ICS-DS-0010, ICS-DS-0011]
confidence: high
references:
  - title: MicroLogix 1400 Programmable Controllers User Manual (1766-UM001P-EN-P, March 2024)
    url: https://literature.rockwellautomation.com/idc/groups/literature/documents/um/1766-um001_-en-p.pdf
    accessed: "2026-11-08"
  - title: Rockwell Automation SD1790 - Important Hardening Guidance ... Restoring Access When the Password Is Unknown (rev. 5.0)
    url: https://www.rockwellautomation.com/en-us/trust-center/security-advisories/advisory.SD1790.html
    accessed: "2026-11-08"
  - title: FBI/EPA PSA I-073026-PSA - Malicious Cyber Actors Targeting Water and Wastewater Sector Internet-Facing PLCs
    url: https://www.ic3.gov/PSA/2026/PSA260730.pdf
    accessed: "2026-11-08"
  - title: CISA - CISA Urges Water and Wastewater Systems Sector to Protect OT Against Activity Targeting PLCs (30 July 2026)
    url: https://www.cisa.gov/news-events/alerts/2026/07/30/cisa-urges-water-and-wastewater-systems-sector-protect-ot-against-activity-targeting-plcs
    accessed: "2026-11-08"
last_verified: "2026-11-08"
notes: >-
  Kept deliberately thin. Round 2 still found no vendor or researcher source
  for an on-controller audit log, change-detection value or syslog on either
  model, so none is listed; that absence is itself the main finding for an
  investigator. All controller detail comes from the MicroLogix 1400 user
  manual; the MicroLogix 1100 user manual (1763-UM001) and both reference
  manuals (1766-RM001 for password and master-password behaviour) were not
  read, so 1100 specifics are not evaluated beyond its SD1790 recovery path.
  The FBI notes the impact differed between 1100 and 1400 without saying how.
  Rockwell's SD1790 rev. 5.0 also covers Micro820 and Micro850, which are not
  part of this record. Whether a password-protected program can be stored to
  a memory module from the LCD was not found; do not try it untested.
  Protocols come from the 1400 manual: "The MicroLogix 1400 supports
  EtherNet/IP™ communication via the Ethernet communication Channel 1. In
  addition, either Modbus TCP or DNP3 over IP can be enabled for Channel 1",
  and its firmware history lists "ST file type for all PCCC commands".
response: baseline
