    provides: Known-good logic and configuration, if it predates the incident.
    normal: A dated, approved .RSS held off the controller, matching change records.
    suspicious: No backup at all; a backup whose date falls inside the intrusion window; a backup that differs from the integrator's copy.
    basis: government
