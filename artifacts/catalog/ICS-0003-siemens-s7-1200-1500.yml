# ICS platform catalog entry
# ICS-0003 - Siemens SIMATIC S7-1200 / S7-1500
# Research notes: docs/research/2026-11-08/platforms.md

id: ICS-0003
name: Siemens SIMATIC S7-1200 / S7-1500
vendor: Siemens
products:
  - SIMATIC S7-1500 (standard, F, T, compact, R/H)
  - SIMATIC S7-1200
asset_class: plc
purdue_levels: ["1"]
protocols: [ICS-PROTO-0003, ICS-PROTO-0017, ICS-PROTO-0010]
os_base: Proprietary CPU firmware; Siemens does not publish its internals
filesystem: >-
  No customer-visible filesystem. Load memory is on the SIMATIC Memory Card;
  the card's on-disk format is not publicly documented and is not treated here
  as an acquisition path.
customer_shell: "no"
memory_acquisition: not-available
program_access: vendor-software-upload
operating_modes: >-
  STARTUP, RUN and STOP, selected with the mode selector (switch or keys,
  depending on article number), the display, STEP 7, an HMI, the web server or
  an STP instruction. Operating mode transitions are written to the
  diagnostics buffer. The "Read access" protection level still allows changing
  the operating state (RUN/STOP) without a password, so a read-protected CPU
  can still be stopped remotely. CISA (AA26-097A) recommends enabling
  programming protection in TIA Portal for software key-switched devices.
integrity_features:
  - feature: Diagnostics buffer with security events
    description: >-
      Chronological ring buffer of diagnostic events, operating mode
      transitions, user-program errors, module removal/insertion and security
      events: going online with the correct or incorrect password, manipulated
      communication data, manipulated data on the memory card, manipulated
      firmware update file, a changed protection level downloaded, password
      legitimization changes, too many simultaneous access attempts, idle
      online-connection timeout, web server logon with correct or incorrect
      password, CPU backup created, CPU configuration restored. Identical
      security events can be configured to collapse into one group alarm per
      interval (Protection > Security event). Contents survive a memory reset.
    versions: S7-1500 manual collection V20 (S7-1200 buffer size and security-event coverage not read)
    confidence: high
    sources:
      - title: CPU diagnostics buffer - SIMATIC diagnostics function manual (TIA Portal Information System)
        url: https://docs.tia.siemens.cloud/r/simatic_et_200eco_pn_manual_collection_zhcn_20/function-manuals/diagnostics-function-manuals/diagnostics/configuring-and-determining-system-diagnostics/options-for-displaying-system-diagnostics/diagnostics-information-in-step-7/cpu-diagnostics-buffer?contentId=iRtCUO9d12wi6MtwQSzXWg
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          The contents of the diagnostics buffer are stored in the retentive
          memory in case of a memory reset of the CPU.
        read: direct
      - title: CPU diagnostics buffer - SIMATIC diagnostics function manual (TIA Portal Information System)
        url: https://docs.tia.siemens.cloud/r/simatic_et_200eco_pn_manual_collection_zhcn_20/function-manuals/diagnostics-function-manuals/diagnostics/configuring-and-determining-system-diagnostics/options-for-displaying-system-diagnostics/diagnostics-information-in-step-7/cpu-diagnostics-buffer?contentId=iRtCUO9d12wi6MtwQSzXWg
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          The following security events (event types) result in an entry in the
          diagnostics buffer.
        read: direct
  - feature: Online/offline comparison by checksum
    description: >-
      STEP 7 decides whether online and offline blocks, PLC data types and tags
      are equal by comparing checksums for software and text lists. Reading
      those checksums needs at least the "Read access" level; with only HMI
      access the comparison column shows question marks.
    confidence: high
    sources:
      - title: What you should know about the access levels (S7-1500) - STEP 7
        url: https://docs.tia.siemens.cloud/r/en-us/v20/functional-description-of-s7-1500-cpus-s7-1500/setting-the-operating-behavior-s7-1500/protection-security-s7-1500/settings-for-access-levels-s7-1500/what-you-should-know-about-the-access-levels-s7-1500
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          The equivalence or non-equivalence of online/offline data is determined
          by STEP 7 through a comparison of the checksums for software and text
          lists. Reading these checksums requires the "read access" access level.
        read: direct
  - feature: Syslog (local cache and forwarding)
    description: >-
      CPUs from firmware V3.1 keep syslog messages in a local cache, readable
      through the web server's Web API method Syslog.Browse, and from STEP 7 V19
      can forward them to a syslog server (Properties > Protection & Security >
      Syslog > Syslog server) over TLS (port 6514) or UDP (port 514). Message
      content is based on IEC 62443-3-3; Siemens publishes the message overview
      as support entry 109823696 (not read).
    versions: S7-1500 CPU firmware V3.1 and later with STEP 7 V19 and later
    confidence: high
    sources:
      - title: Introduction (S7-1500) - Syslog - STEP 7 V21
        url: https://docs.tia.siemens.cloud/r/en-us/v21/functional-description-of-s7-1500-cpus-s7-1500/setting-the-operating-behavior-s7-1500/protection-security-s7-1500/syslog-s7-1500/introduction-s7-1500
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          Each CPU as of FW version V3.1 saves syslog messages in a local cache.
          By querying this cache, you can view the syslog messages and identify
          potential security risks. To access the local cache with the syslog
          messages, use the Web API of the web server (API method
          `Syslog.Browse`).
        read: direct
  - feature: Access protection levels
    description: >-
      Full access, Read access, HMI access and No access (complete protection,
      the default), with a password per level. "No access" disables the
      PUT/GET server function. A changed protection level downloaded to the CPU
      is itself a diagnostics-buffer security event.
    confidence: high
    sources:
      - title: What you should know about the access levels (S7-1500) - STEP 7
        url: https://docs.tia.siemens.cloud/r/en-us/v20/functional-description-of-s7-1500-cpus-s7-1500/setting-the-operating-behavior-s7-1500/protection-security-s7-1500/settings-for-access-levels-s7-1500/what-you-should-know-about-the-access-levels-s7-1500
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          In addition, HMI access and access to diagnostics data, display of
          offline/online comparison results, changing the operating state
          (RUN/STOP), and setting time-of-day is possible.
        read: direct
collection:
  - method: Syslog messages already received by the site's syslog server or SIEM
    impact: passive
    description: Only where forwarding was configured (FW V3.1+, STEP 7 V19+).
    confidence: high
    references:
      - https://docs.tia.siemens.cloud/r/en-us/v21/functional-description-of-s7-1500-cpus-s7-1500/setting-the-operating-behavior-s7-1500/protection-security-s7-1500/syslog-s7-1500/introduction-s7-1500
  - method: Passive capture of S7comm-plus (TCP 102) and PROFINET traffic (TAP or SPAN)
    impact: passive
    description: Downloads, uploads, mode changes and the hosts that made them, independent of the CPU.
    confidence: medium
  - method: Read the diagnostics buffer page of the S7-1500 web server
    impact: read-only
    description: >-
      Siemens documents the web server's "Diagnostics buffer" page as a
      display of the buffer. Requires the web server to have been enabled
      beforehand; do not enable it during an incident.
    safety_note: >-
      Log on with an account that has no operating-mode or write rights. The
      logon itself is a security event written into the same buffer, so record
      the time and expect one new entry (or one group alarm).
    confidence: high
    references:
      - https://docs.tia.siemens.cloud/r/simatic_et_200eco_pn_manual_collection_zhcn_20/function-manuals/diagnostics-function-manuals/diagnostics/configuring-and-determining-system-diagnostics/options-for-displaying-system-diagnostics/diagnostics-information-in-step-7/cpu-diagnostics-buffer?contentId=iRtCUO9d12wi6MtwQSzXWg
  - method: Read the syslog local cache through the web server Web API (Syslog.Browse)
    impact: read-only
    description: CPU firmware V3.1 and later; a documented read method of the Web API.
    safety_note: Needs web server access rights; the authentication is itself logged.
    confidence: high
    references:
      - https://docs.tia.siemens.cloud/r/en-us/v21/functional-description-of-s7-1500-cpus-s7-1500/setting-the-operating-behavior-s7-1500/protection-security-s7-1500/syslog-s7-1500/introduction-s7-1500
  - method: TIA Portal Online & Diagnostics > Diagnostics buffer
    impact: online-vendor-tool
    description: Displays and allows saving the buffer, with filters by event type.
    safety_note: >-
      An online session can also download, force, or change operating mode.
      Going online with a password is a security event that adds an entry.
      Operations approval required.
    confidence: high
    references:
      - https://docs.tia.siemens.cloud/r/simatic_et_200eco_pn_manual_collection_zhcn_20/function-manuals/diagnostics-function-manuals/diagnostics/configuring-and-determining-system-diagnostics/options-for-displaying-system-diagnostics/diagnostics-information-in-step-7/cpu-diagnostics-buffer?contentId=iRtCUO9d12wi6MtwQSzXWg
  - method: TIA Portal "Upload from device (software)" into a new project, then online/offline comparison against the known-good project
    impact: online-vendor-tool
    description: >-
      Possible in RUN or STOP. Captures blocks (OB, FC, FB, DB), PLC tags,
      technology objects and current DB values, but not the hardware
      configuration or diagnostics buffer.
    safety_note: Operations approval required; same session risks as any online connection.
    confidence: high
    references:
      - https://docs.tia.siemens.cloud/r/simatic_s7_1500_et_200mp_manual_collection_enus_20/basic-information/automation-system/commissioning/operating-modes/operating-mode-transitions
  - method: TIA Portal "Backup from online device"
    impact: process-risk
    description: >-
      The most complete image (adds hardware configuration, memory card
      content, archives and recipes), but Siemens lists it as possible only in
      STOP. Diagnostics-buffer entries are in none of the backup types.
    safety_note: Requires stopping the CPU - break-glass only, with the process in an agreed safe state.
    confidence: high
    references:
      - https://docs.tia.siemens.cloud/r/simatic_s7_1500_et_200mp_manual_collection_enus_20/basic-information/automation-system/commissioning/operating-modes/operating-mode-transitions
volatility:
  - >-
    The diagnostics buffer is a ring buffer; on the S7-1500 the 500 newest
    entries are retained across power-on and STOP-to-STARTUP transitions. The
    total number of entries per CPU is in each CPU's technical specifications
    (not read here). Floods of events, including the investigator's own logons,
    push old entries out.
  - Diagnostics-buffer entries are not captured by any TIA Portal backup type; save them separately.
  - A memory reset keeps the diagnostics buffer, time of day and IP address.
