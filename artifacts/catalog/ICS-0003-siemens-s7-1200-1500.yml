    retention: Ring buffer; S7-1500 retains the 500 newest entries across power-on and STOP-to-STARTUP; capacity per CPU model not read
    forensic_value: high
    evidence_type: [impair-process-control, inhibit-response-function, execution, timeline]
    confidence: high
    collection_impact: read-only
    description: >-
      Time-stamped events in the order they occurred: module errors, CPU
      system errors, operating mode transitions (with the cause, such as STEP
      7, HMI, web server or mode selector), user-program errors, module
      removal/insertion and security events.
    provides: When the CPU changed mode, why, and what security events accompanied it.
    normal: >-
      Mode transitions and restarts that match maintenance records; no
      security events beyond known engineers going online.
    suspicious: >-
      RUN-to-STOP caused by STEP 7 or the web server with no approved work;
      a STOP followed by STARTUP shortly after an unexpected online session;
      user-program errors appearing after a download nobody scheduled.
    basis: vendor
