notes: >-
  Offline logic comparison: after an "Upload from device" into a new, empty
  offline project (online-vendor-tool impact - operations must approve), export
  the blocks and tag tables with TIA Portal Openness (SimaticML XML) and compare
  them with the known-good project's export using `python -m icstriage
  logic-diff` (docs/logic-compare.md). Know-how-protected blocks export only
  their interface, so their code is reported as not evaluated.
  Every Siemens page used is S7-1500 documentation. The S7-1200 shares the
  diagnostics-buffer concept, but its buffer size, security-event list and
  syslog support were not read; treat S7-1200 specifics as not evaluated. The
  CPU diagnostics buffer page sits in the ET 200eco PN manual collection
  (shared diagnostics function manual) and was read in English. Siemens'
  syslog message overview (support entry 109823696) and Industrial Security
  operational guidelines were not read.
response: baseline
hardening: siemens-s7
artifacts:
