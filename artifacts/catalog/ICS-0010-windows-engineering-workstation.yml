# ICS platform catalog entry
# ICS-0010 - Windows engineering workstation
# Research notes: docs/research/2026-11-08/platforms.md

id: ICS-0010
name: Windows engineering workstation (TIA Portal, Studio 5000, EcoStruxure Control Expert, VisiLogic, TriStation)
vendor: multiple
products:
  - Siemens TIA Portal / STEP 7
  - Rockwell Studio 5000 Logix Designer
  - Schneider Electric EcoStruxure Control Expert (formerly Unity Pro)
  - Unitronics VisiLogic
  - Schneider Electric TriStation 1131 (Triconex)
asset_class: engineering-workstation
purdue_levels: ["2", "3"]
protocols: [ICS-PROTO-0003, ICS-PROTO-0004, ICS-PROTO-0012, ICS-PROTO-0013, ICS-PROTO-0016]
os_base: Microsoft Windows
filesystem: NTFS
customer_shell: "yes"
memory_acquisition: customer
program_access: file-copy
operating_modes: >-
  Not applicable to the host. What matters is whether the workstation had an
  online session open to a controller at the time of interest; the
  controllers' own logs (ICS-0001 controller log, ICS-0003 diagnostics buffer,
  Control Expert syslog) record the workstation and user names on their side.
integrity_features:
  - feature: Control Expert event logging to syslog
    description: >-
      When "Event Logging" is selected in Control Expert project settings
      (cleared by default) and a syslog server is configured, Control Expert
      sends application actions (open/save project, build online, transfer to
      or from the controller, start/stop, forces, variable modifications), DTM
      actions, password actions and file actions. Each message carries the
      user name and the Control Expert process id.
    confidence: high
    sources:
      - title: Modicon Controller Systems Cybersecurity User Guide (EIO0000001999.12), distributor-hosted copy
        url: https://docs.rs-online.com/7a9a/A700000012779990.pdf
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          Select Event Logging check box (cleared by default).
        read: direct
collection:
  - method: Windows event logs already forwarded to a collector or SIEM (Security, Sysmon, PowerShell)
    impact: passive
    description: Copies held off the workstation; no contact with the host.
    confidence: high
  - method: Control Expert events already received by the site syslog server
    impact: passive
    description: Only where Event Logging was enabled in the project before the incident.
    confidence: high
    references:
      - https://docs.rs-online.com/7a9a/A700000012779990.pdf
  - method: Offline disk image (workstation shut down by agreement, or a VM snapshot or backup)
    impact: passive
    description: >-
      Full NTFS image for timeline work: project folders, user profiles,
      registry hives, event logs. Agree first whether the workstation is
      needed for recovery; it may hold the only current project copies.
    safety_note: >-
      Shutting the workstation down ends any online session it has with a
      controller; confirm with operations that none is open and that no HMI or
      runtime component runs on it.
    confidence: medium
  - method: Live triage collection on the running workstation (for example KAPE with the SiemensTIA target)
    impact: process-risk
    description: Collects user-profile files and logs without shutting down.
    safety_note: >-
      Rated process-risk by this project because engineering workstations may
      hold open online sessions to controllers or run HMI/runtime software, and
      triage tools load the host. On a workstation confirmed idle with no
      online connection, operations may accept it at lower risk.
    confidence: medium
    unverified: true
    references:
      - https://blog.nviso.eu/2022/03/30/investigating-an-engineering-workstation-part-2/
volatility:
  - TIA Portal Settings.xml is rewritten only on a normal close of TIA Portal (NVISO); a crash or killed process leaves it stale.
  - Sysmon network-connection events (Event ID 3) are disabled by default; their absence means nothing unless the configuration enabled them.
anti_forensics:
  - technique: Attack tool named to masquerade as a legitimate engineering-suite utility
    seen_in: TRITON
    detail: >-
      Mandiant: trilog.exe imitated the Triconex Trilog log-review application
      on the SIS engineering workstation, with inject.bin and imain.bin payloads
      beside it.
  - technique: Replacement of the Step 7 communication library so the workstation shows clean blocks while the PLC runs infected ones
    seen_in: Stuxnet
    detail: >-
      Symantec: Stuxnet renamed s7otbxdx.dll to s7otbxsx.dll and installed its
      own s7otbxdx.dll that intercepts block read, write and enumerate calls.
      Block comparisons made from an infected workstation cannot be trusted.
  - technique: TIA Portal Settings.xml can be deleted or edited by the user with no extra privilege
    seen_in: NVISO research (no campaign reported)
    detail: TIA Portal recreates a fresh file on next start.
datasources: [ICS-DS-0006, ICS-DS-0007, ICS-DS-0005, ICS-DS-0001, ICS-DS-0004]
confidence: medium
references:
