# ICS platform catalog entry
# ICS-0013 - Cellular and industrial remote-access gateways
# Research notes: docs/research/2026-11-08/platforms.md

id: ICS-0013
name: Cellular and industrial remote-access gateways (Sierra Wireless AirLink, Teltonika, Moxa, Digi)
vendor: multiple
products:
  - Sierra Wireless (Semtech) AirLink routers - AirLink OS (e.g. RX55, XR90) and ALEOS
  - Teltonika RUT series (RutOS)
  - Moxa and Digi cellular gateways (not researched in this pass)
asset_class: remote-access-gateway
purdue_levels: ["2", "3.5"]
protocols: []
os_base: Vendor router firmware (AirLink OS / ALEOS, Teltonika RutOS); internals not covered by the sources read
customer_shell: restricted
memory_acquisition: not-available
program_access: web-export
operating_modes: >-
  Not applicable. The questions are which remote-access services were
  reachable (SSH, web UI, VPN), which port forwards exposed controllers, and
  whether the device logs survive a reboot or reset.
integrity_features:
  - feature: AirLink OS audit log
    description: >-
      AirLink OS keeps regular logs and audit logs. The audit log holds all
      device changes since manufacture, is unaffected by log-level settings,
      and is not erased by factory reset or reflashing; a rotation policy
      limits its size. The logs contain no passwords.
    versions: AirLink OS 5.1 (RX55 documentation); ALEOS not read
    confidence: high
    sources:
      - title: Logging - AirLink OS RX55-5.1 (Sierra Wireless Source)
        url: https://source.sierrawireless.com/airlinkos/RX55-5.1/reference/system/howto/logs/
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          Note: Neither factory resetting nor reflashing will erase the logs.
          There is no current method to erase either of the logs. A log rotation
          policy is used to control the size of the logs.
        read: direct
  - feature: Teltonika Events Log and Events Reporting
    description: >-
      Events Log records logins, reboots, resets, connections and
      configuration changes. Events Reporting rules can send SMS or email on
      configuration changes, SSH and WebUI authentication success or failure,
      reboots and WAN failover, and logs can be shipped periodically to FTP or
      email.
    versions: RUT230 documentation for firmware RUT2XX_R_00.01.14.1 (older WebUI); current RutOS pages not compared
    confidence: high
    sources:
      - title: RUT230 Events Log - Teltonika Networks Wiki
        url: https://wiki.teltonika-networks.com/view/RUT230_Events_Log
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          you can view records of events such as logins, reboots, resets,
          connections, configuration changes and more.
        read: direct
collection:
  - method: Gateway logs already forwarded (syslog server, Teltonika RMS, Sierra ALMS, scheduled FTP/email reports)
    impact: passive
    description: Off-device copies; no contact with the gateway.
    confidence: high
  - method: Download the logs from the device web UI (AirLink OS System > Logs, Teltonika Logs pages) or retrieve them through ALMS
    impact: read-only
    description: Vendor-documented download of the regular and audit logs (AirLink OS) or event logs (Teltonika).
    safety_note: >-
      The gateway is often the only link to a remote site; do not reboot,
      reset or reconfigure it while collecting. Logging on is itself logged.
    confidence: high
    references:
      - https://source.sierrawireless.com/airlinkos/RX55-5.1/reference/system/howto/logs/
      - https://wiki.teltonika-networks.com/view/RUT230_Logs
  - method: Passive capture on the gateway's LAN side (TAP or SPAN between gateway and controllers)
    impact: passive
    description: Shows remote sessions reaching controllers through the gateway.
    confidence: medium
volatility:
  - >-
    Teltonika system logs are stored in RAM by default (option "Save log in":
    RAM or flash; log file size default 128 KB). RAM storage is presumed lost on
    reboot (toolkit inference). Collect before any power cycle.
  - AirLink OS logs survive factory reset and reflash (vendor statement) but rotate by size.
datasources: [ICS-DS-0012, ICS-DS-0005, ICS-DS-0004, ICS-DS-0014, ICS-DS-0003]
confidence: medium
references:
  - title: Logging - AirLink OS RX55-5.1 (Sierra Wireless Source)
    url: https://source.sierrawireless.com/airlinkos/RX55-5.1/reference/system/howto/logs/
    accessed: "2026-11-08"
  - title: RUT230 Logs - Teltonika Networks Wiki
