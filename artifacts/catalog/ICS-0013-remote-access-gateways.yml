  - title: RUT230 Events Log - Teltonika Networks Wiki
    url: https://wiki.teltonika-networks.com/view/RUT230_Events_Log
    accessed: "2026-11-08"
  - title: TRB143 Maintenance - Teltonika Networks Wiki
    url: https://wiki.teltonika-networks.com/view/TRB143_Maintenance
    accessed: "2026-11-08"
  - title: CISA AA26-097A
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
    accessed: "2026-11-08"
  - title: Unitronics - Cyber Protection, Vision and Samba Series
    url: https://www.unitronicsplc.com/cyber_security_vision-samba/
