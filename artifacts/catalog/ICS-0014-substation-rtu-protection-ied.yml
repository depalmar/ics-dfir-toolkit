# ICS platform catalog entry
# ICS-0014 - Substation RTU and protection IED (IEC 60870-5-104, IEC 61850)
# Research notes: docs/research/2026-11-08/platforms-round2.md

id: ICS-0014
name: Substation RTU and protection IED (IEC 60870-5-104, IEC 61850)
vendor: multiple
products:
  - Hitachi Energy RTU500 series (RTU560 named by CERT Polska, Poland December 2025)
  - Hitachi Energy Relion 650 / 670 series protection and control IEDs (650 v1.1 named by CERT Polska; 670 v2.2 guideline read)
  - Mikronika RTUs (Linux-based; named by CERT Polska)
  - Siemens SIPROTEC protection relays (SIPROTEC DoS in Industroyer; SIPROTEC 5 logging documentation read)
  - ABB substation automation products whose files the Industroyer wiper targeted (MicroSCADA, PCM600 projects)
asset_class: rtu
purdue_levels: ["1", "2"]
protocols: [ICS-PROTO-0007, ICS-PROTO-0008, ICS-PROTO-0009, ICS-PROTO-0006]
os_base: >-
  Vendor firmware, different per product. CERT Polska describes the RTU560
  firmware file as an ELF image and the Mikronika controllers as Linux-based;
  Relion and SIPROTEC internals are not published.
filesystem: >-
  Varies. RTU500 series archives events, security events and disturbance files
  on non-volatile CompactFlash (Hitachi Energy). Relion 650 v1.1 exposes system
  files over FTP, enabled by default (CERT Polska). Mikronika RTUs have a Linux
  filesystem with shell history (CERT Polska). SIPROTEC 5 log storage is
  battery-buffered or flash (Siemens).
customer_shell: restricted
memory_acquisition: not-available
program_access: vendor-software-upload
operating_modes: >-
  No key switch common to the class. Relion 670 v2.2 records entering test
  mode, simulation mode and configuration mode, forced signals and manual
  resets as numbered security events (6110, 6170, 13250, 6140, 5110). The
  RTU560 event log excerpt printed by CERT Polska shows "Manual Reset" (5110)
  and "Gateway/RTU restarted" (5160) after a firmware transfer. SIPROTEC 5
  mode handling was not read.
integrity_features:
  - feature: RTU500 secure update (firmware signature verification)
    description: >-
      Verifies the digital signature of uploaded firmware. CERT Polska reports
      it was introduced in firmware 13.2.1 but had to be activated explicitly,
      that none of the affected RTUs that supported it had it enabled, and that
      CVE-2024-2617 allows it to be bypassed until 13.7.7. Without it the
      Poland attacker loaded a modified firmware image that left the RTUs in a
      reboot loop.
    versions: RTU500 firmware 13.2.1 and later (bypass fixed in 13.7.7, per CERT Polska)
    confidence: high
    sources:
      - title: CERT Polska - Energy Sector Incident Report, 29 December 2025 (PDF)
        url: https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Report_2025.pdf
        accessed: "2026-11-08"
        kind: government
        quote: >-
          The secure update feature, which enables verification of the uploaded
          firmware’s digital signature, was introduced in version 13.2.1
        read: direct
      - title: CERT Polska - Energy Sector Incident Report, 29 December 2025 (PDF)
        url: https://cert.pl/uploads/docs/CERT_Polska_Energy_Sector_Incident_Report_2025.pdf
        accessed: "2026-11-08"
        kind: government
        quote: None of the devices that supported secure update had this feature enabled.
        read: direct
  - feature: Relion 670 security events (user activity logging)
    description: >-
      Security-relevant user operations are logged with event ID, timestamp,
      sequence number, user name, severity and source; up to 10240 are kept on
      the IED and can be sent to up to six external syslog (RFC 3164/5424) or
      ArcSight CEF servers, or reported over IEC 61850 (logical node GSAL).
      Events raised while the server is unreachable are not resent; read them
      from the IED with PCM600. Reading needs the SECAUD role or "Audit log
      read" right.
    versions: 670 series version 2.2 (guideline 1MRK 511 399-UEN); 650 v1.1 not read
    confidence: medium
    unverified: true
    sources:
      - title: 670 series Version 2.2 IEC Cybersecurity deployment guideline (Hitachi Energy, 1MRK 511 399-UEN)
        url: https://publisher.hitachienergy.com/download?DocumentID=1MRK511399-UEN&LanguageCode=en&DocumentPartId=&Action=download&DocumentRevisionId=Y&parentURL=68747470733a2f2f7075626c69736865722e68697461636869656e657267792e636f6d2f646f63756d656e74733f6369643d39414146343032303838
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          A security event contains an event ID, a time stamp, a sequence
          number, the user name, the severity of the action and the name of the
          source. These events can be sent to external security log servers
          using Syslog.
        read: direct
  - feature: SIPROTEC 5 security log and setting-history log
    description: >-
      Two ring-buffer logs the user cannot delete: the security log (access to
      restricted areas, including unsuccessful and unauthorised attempts; up to
      2048 indications) and the setting-history log (every setting change and
      every downloaded parameter set; up to 200 indications). Siemens says to
      read them regularly to archive them without loss.
    versions: SIPROTEC 5 operation manual V08.83
    confidence: high
    sources:
      - title: SIPROTEC 5 Operation manual V08.83 (Siemens, C003-G)
        url: https://cache.industry.siemens.com/dl/files/321/109742321/att_1089364/v1/SIP5_Operating_V08.83_Manual_C003-G_en.pdf
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          Not all logs of your SIPROTEC 5 device can be deleted. These
          limitations apply especially to logs with relevance for security and
          after-sales (security log, device-diagnosis log, setting-history log).
        read: direct
  - feature: RTU500 data archives
    description: >-
      Archives on non-volatile CompactFlash for events, measurements, counters,
      security events, protection-relay disturbance files and meter load
      profiles, readable through the RTU web server and by file transfer.
    confidence: high
    sources:
      - title: RTU500 series function and software (Hitachi Energy product page)
        url: https://www.hitachienergy.com/us/en/products-and-solutions/substation-automation-protection-and-control/products/remote-terminal-units/rtu500-series-function-and-software
        accessed: "2026-11-08"
        kind: vendor
        quote: >-
          Data archives in RTU500 series products provide archive functions on
          non-volatile compact flash for events, measurements, counter values,
          security events, disturbance files of protection relays and load
          profiles of metering devices.
        read: direct
collection:
  - method: Security events already received by the site syslog/CEF server or SIEM
    impact: passive
    description: >-
      Only where forwarding was configured beforehand: in the Relion 670 v2.2
      ACTIVLOG settings every external log server is Off by default. Events
      raised while the server was unreachable are missing from this copy.
    confidence: high
    references:
      - https://publisher.hitachienergy.com/download?DocumentID=1MRK511399-UEN&LanguageCode=en&DocumentPartId=&Action=download&DocumentRevisionId=Y&parentURL=68747470733a2f2f7075626c69736865722e68697461636869656e657267792e636f6d2f646f63756d656e74733f6369643d39414146343032303838
  - method: Copy engineering projects, SCL files, saved logs and exported fault records from engineering hosts and backups
    impact: passive
    description: >-
      PCM600 and DIGSI 5 projects, .scd/.icd/.cid files and COMTRADE exports
      live on engineering workstations and backup media. DIGSI 5 stores the
      log contents and fault records it last read in the linked offline
      configuration, so an earlier read may already hold entries the device has
      since overwritten. These copies are also the known-good reference for
      comparing device configuration.
    confidence: high
    references:
      - https://cache.industry.siemens.com/dl/files/321/109742321/att_1089364/v1/SIP5_Operating_V08.83_Manual_C003-G_en.pdf
  - method: Passive capture of IEC 60870-5-104, IEC 61850 MMS/GOOSE, DNP3 and management traffic (TAP or SPAN)
    impact: passive
    description: >-
      Shows which hosts sent control commands, enumerated MMS objects, or
      opened web, FTP or SSH sessions to RTUs and IEDs, independent of device
      logging. GOOSE is layer-2 multicast and is only visible on a SPAN or TAP
      inside the station bus.
    confidence: medium
  - method: Read the SIPROTEC 5 security log and setting-history log on the device's on-site operation panel
    impact: read-only
    description: >-
      Main menu → Test & Diagnosis → Logs → Security log; Main menu →
      Indications → Setting changes. Needs someone at the panel; no network
      session to the relay.
    safety_note: >-
      Navigate only the Indications and Logs menus. Agree the visit with the
      operator in charge of the substation; do not touch control or test
      functions on the panel.
    confidence: high
    references:
      - https://cache.industry.siemens.com/dl/files/321/109742321/att_1089364/v1/SIP5_Operating_V08.83_Manual_C003-G_en.pdf
  - method: Read RTU500 archives and system diagnosis through the RTU web server
    impact: read-only
    description: >-
      Hitachi Energy documents archive access via the web server under user
      account management. Use an account without firmware or configuration
      rights.
    safety_note: >-
      The login is itself logged ("Log-in successful", 1110, in the format
      CERT Polska printed), so record the time. The Poland attacker used this
      same interface with a firmware-capable account; never log in with such an
      account to collect evidence.
    confidence: high
    references:
      - https://www.hitachienergy.com/us/en/products-and-solutions/substation-automation-protection-and-control/products/remote-terminal-units/rtu500-series-function-and-software
  - method: Read SIPROTEC 5 logs and fault records online with DIGSI 5 ("Read log entries", "Read records")
    impact: online-vendor-tool
    description: >-
      Security log: Project → Online access → Device → Device Information →
      Logs tab → Security logs. Save before anything is deleted; Siemens notes
      log deletion is per log and fault-record deletion also removes the
      matching fault-log entries.
    safety_note: >-
      The same DIGSI session can change settings, delete logs and fault records
      and send commands. Operations approval required; name the operator.
    confidence: high
    references:
      - https://cache.industry.siemens.com/dl/files/321/109742321/att_1089364/v1/SIP5_Operating_V08.83_Manual_C003-G_en.pdf
  - method: Read Relion 670 security events with the PCM600 Event Viewer, and disturbance records over FTP
    impact: online-vendor-tool
    description: >-
      Hitachi Energy names the PCM600 Event Viewer as the place to read
      security events when syslog is not configured. Disturbance records can
      only be read over FTP without TLS.
    safety_note: >-
      PCM600 can also write configuration and firmware. Use a dedicated
      file-transfer-only account for disturbance records (the vendor's own
      advice, because the FTP password crosses the wire in clear text).
      Operations approval required.
    confidence: high
    references:
      - https://publisher.hitachienergy.com/download?DocumentID=1MRK511399-UEN&LanguageCode=en&DocumentPartId=&Action=download&DocumentRevisionId=Y&parentURL=68747470733a2f2f7075626c69736865722e68697461636869656e657267792e636f6d2f646f63756d656e74733f6369643d39414146343032303838
volatility:
  - Relion 670 v2.2 keeps up to 10240 security events, then overwrites the oldest; event 9996 marks the overflow warning at 10000.
  - >-
    SIPROTEC 5 logs are ring buffers (security log 2048 entries, setting-history
    log 200). An initial start after a device-software update automatically
    deletes the operational, fault, switching-device, ground-fault,
    setting-history and user-defined logs; the security log is not in that list.
  - Deleting a SIPROTEC 5 fault log also deletes its fault records and resets the fault and fault-record counters to 0.
  - >-
    Destroyed devices may still hold logs. CERT Polska printed an RTU560 event
    log excerpt from 29 December 2025, and Mikronika recovered part of the logs
    from its damaged RTUs. Keep failed units for vendor analysis instead of
    reflashing or scrapping them.
anti_forensics:
  - technique: Wiper overwrote substation configuration files (.scl, .cid, .scd) and ABB product files on Windows hosts
    seen_in: Industroyer
    detail: >-
      ESET lists SCL-family extensions, SYS_BASCON.COM and ABB .paf licence
      files among the wiper's targets; it ran after the protocol payloads.
  - technique: All files deleted on Linux-based RTUs over SSH with a root account; the command was not preserved in shell history
    seen_in: Poland, December 2025 (CERT Polska)
  - technique: Modified firmware uploaded to RTUs, leaving them in a reboot loop
    seen_in: Poland, December 2025 (CERT Polska)
    detail: >-
      240 bytes of 0xFF inserted at the program entry point; the image reported
      version 13.5.3.0, which no affected site ran. Hitachi Energy PSIRT
      independently confirmed the scenario.
