notes: >-
  A class record: products differ, so every vendor-specific claim names its
  product and version. The Relion event numbers come from the 670 series 2.2
  guideline; the RTU560 excerpt CERT Polska printed uses the same numbers and
  texts for 1110, 5110 and 13400, which suggests (toolkit inference, not
  vendor-stated) a shared Hitachi Energy event scheme - check the product's own
  manual before relying on it. Relion 650 v1.1 documentation, the RTU500
  cybersecurity deployment guideline and RTU500 syslog configuration were not
  read (the Hitachi Energy publisher download for the RTU cybersecurity
  brochure failed to fetch). Siemens SIPROTEC 4, the family Industroyer's DoS
  tool hit, was not read; the SIPROTEC 5 manual describes a later generation.
  Mikronika documentation was not found. customer_shell is "restricted"
  because it varies: Mikronika RTUs expose a root SSH console (CERT Polska),
  the others only web, FTP or vendor-tool access. Vendor default credentials
  are documented in the guidelines read but are deliberately not reproduced
  here; check that the factory default user is removed or changed. The 670
  series 2.2 guideline link (1MRK511399-UEN, DocumentRevisionId=Y) now opens
  Hitachi Energy's "the linked document cannot open as it does not exist
  anymore" page (rendered read, 2026-11-08), so its four quotes are kept as
  read on 2026-11-08 but the feature and the two artifacts they support are
  marked unverified at medium until the current revision is located and
  re-read; the collection methods that cite it carry the same caveat.
