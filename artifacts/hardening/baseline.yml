  - id: base-view-only-accounts
    control: Limit remotely reachable and default HMI/controller accounts to view-only and separate view from control
    category: identity
    priority: high
    why: >-
      The AA25-343A actors changed setpoints and cleared alarms from the HMI
      graphical interface and changed HMI credentials to lock operators out. A
      view-only account would have denied the change without any exploit.
    how: >-
      Enable the control system's security features that separate and audit view
      and control functions; make remotely accessible and default accounts
      view-only. Platform files give the vendor's role settings.
    blunts:
      - AA25-343A pro-Russia hacktivist HMI manipulation (2024-2025)
    frameworks:
      - CISA CPG 2.0 3.G
    confidence: high
    sources:
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Limiting remotely accessible or default user accounts to “view-only” removes the potential for impact without exploiting a vulnerability"
