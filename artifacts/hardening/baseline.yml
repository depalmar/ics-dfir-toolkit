# Prevention and hardening - baseline for every OT platform
# Schema: ../schema/hardening.schema.json
#
# Drawn from government guidance written for OT: the CISA/FBI/EPA/DOE "Primary
# Mitigations" fact sheet (May 2025), the mitigations sections of AA26-097A,
# AA26-231A, AA25-343A and AA23-335A, ASD's ACSC-led "Principles of operational
# technology cyber security" (October 2024), the joint OT asset inventory
# guidance (August 2025), CISA's Secure by Demand OT considerations, NSA/CISA
# "Control System Defense: Know the Opponent" (AA22-265A) and NIST SP 800-82r3.
# Platform files add the vendor-specific how. Research notes:
# docs/research/2026-11-08/hardening-and-response.md

platform_id: ALL
name: Baseline for every OT environment
summary: >-
  The controls every platform in this toolkit shares. The 2023-2026 PLC and HMI
  intrusions that US and allied agencies reported (Unitronics in 2023, pro-Russia
  hacktivist VNC access in 2024-2025, Iranian-affiliated exploitation of Rockwell,
  Siemens and Schneider PLCs in 2025-2026) began with a controller, HMI or modem
  reachable from the internet with default or weak credentials. The same
  advisories show the investigation then depending on offline logic backups,
  off-box logs and the ability to run the process by hand.

controls:
  # ---------------------------------------------------------------- exposure
  - id: base-ot-off-internet
    control: Remove every OT device's direct connection to the public internet
    category: exposure
    priority: critical
    why: >-
      The first mitigation in every recent joint OT advisory. CISA, FBI, EPA and
      DOE say OT devices are easy targets once internet-connected because they
      lack modern authentication and are found by port searches; AA26-097A and
      AA23-335A describe actors connecting straight to internet-facing PLCs.
    how: >-
      Identify public-facing assets and remove unintentional exposure. Where
      remote access is genuinely needed, remove inbound port exposure and broker
      all access through a secure gateway or jump host (see
      base-brokered-remote-access). No vendor syntax applies at this level; each
      platform file gives the vendor's own wording.
    operational_impact: >-
      Integrators and service providers may depend on the existing path for
      remote monitoring; AA26-097A asks owners to tell them about the threat and
      work with IT/OT staff or integrators to make the change.
    blunts:
      - AA26-097A Iranian-affiliated exploitation of internet-facing PLCs (2025-2026)
      - AA23-335A CyberAv3ngers compromise of internet-facing Unitronics PLCs (2023)
      - AA25-343A pro-Russia hacktivist access to internet-facing VNC/HMI (2024-2025)
    frameworks:
      - CISA CPG 2.X
      - CISA CPG 2.0 3.S
    confidence: high
    sources:
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "OT devices are easy targets when connected to the internet."
        read: direct
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Critical infrastructure entities should identify their public-facing assets and remove unintentional exposure."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Specifically, “remove inbound port exposure,” so the OT system is never directly exposed to the internet or external networks, and to ensure all access is mediated, monitored, and controlled."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "When connected to the internet, OT devices are easy targets for malicious cyber threat actors."
        read: direct
      - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (updated December 2024)
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
        accessed: "2026-11-08"
        kind: government
        quote: "These mitigations should be applied to any internet-facing PLCs."
        read: direct

  - id: base-scan-own-exposure
    control: Check your own address ranges for exposed OT, including connections set up by third parties
    category: exposure
    priority: high
    why: >-
      Owners often do not know a controller or VNC host is reachable; AA25-343A
      singles out connections set up by third parties, and AA26-231A warns that
      owners working through integrators "may not realize that their systems are
      exposed".
    how: >-
      Use attack-surface management services and internet search platforms
      against the ranges you own, and CISA's no-cost Cyber Hygiene vulnerability
      scanning for US critical infrastructure. Scan only your own public ranges
      from outside; this is not a scan of the control network.
    frameworks:
      - CISA CPG 2.0 3.S
    confidence: high
    sources:
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Asset owners should use attack surface management services and web-based search platforms to scan the internet."
        read: direct
      - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (updated December 2024)
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
        accessed: "2026-11-08"
        kind: government
        quote: "CISA Cyber Hygiene services can help provide additional review of organizations’ internet accessible assets."
        read: direct
      - title: NSA, CISA, FBI, DOE, EPA AA26-231A - Defending Against an Active Threat to Siemens S7 Series PLCs
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-231a
        accessed: "2026-11-08"
        kind: government
        quote: "These mitigations are particularly important for owners and operators who work with third-party service providers or system integrators who may have remote access to PLCs, as the asset owners may not realize that their systems are exposed and at risk."
        read: direct

  - id: base-protect-engineering-data
    control: Treat engineering configuration data and project files as sensitive and keep them inside the OT trust boundary
    category: exposure
    priority: high
    why: >-
      ASD says engineering configuration data keeps its value to an adversary for
      decades; AA26-097A reports actors exfiltrating PLC project files. NSA and
      CISA advise limiting what is disclosed about system hardware, firmware and
      software.
    how: >-
      Store critical OT data in a protected repository segregated from the
      corporate environment and the internet; know where copies live (vendors,
      consultants, email, cloud); stop EDR, antivirus or staff from uploading OT
      files to online scanning or storage services. Siemens adds encryption at
      rest and in transit for project files. No product syntax is published at
      this level.
    confidence: high
    sources:
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "Ideally, critical OT data is always protected to the level of the OT system and as such should be stored in a protected repository that is segmented and segregated from the corporate environment and the internet."
        read: direct
      - title: NSA, CISA - Control System Defense - Know the Opponent (AA22-265A)
        url: https://media.defense.gov/2022/Sep/22/2003083007/-1/-1/0/CSA_ICS_Know_the_Opponent_.PDF
        accessed: "2026-11-08"
        kind: government
        quote: "To the extent possible, avoid disclosing information about system hardware, firmware, and software in any public forum."
        read: direct
      - title: Siemens - Cybersecurity for Industry Operational Guidelines v2.2.1
        url: https://cert-portal.siemens.com/operational-guidelines-industrial-security.pdf
        accessed: "2026-11-08"
        kind: vendor
        quote: "Otherwise industrial project files might be uploaded unintentionally and automatically to external systems."
        read: direct

  # ---------------------------------------------------------- asset inventory
  - id: base-asset-inventory
    control: Build and maintain an OT asset inventory with the high-priority attributes the joint guidance lists
    category: asset-inventory
    priority: high
    why: >-
      Every later control (exposure checks, patching, known-good logic, response
      scoping) needs to know what exists. The joint inventory guidance and
      AA25-343A both make it a foundation.
    how: >-
      Follow the joint guidance's steps: define scope and governance, identify
      assets by physical inspection and logical survey, collect the high-priority
      attributes (protocols, criticality, asset number, role, hostname, IP, logging,
      MAC, manufacturer, model, OS, location, ports/services, user accounts), build
      a taxonomy aligned to zones and conduits, validate, and review periodically.
    frameworks:
      - CISA CPG 2.0 2.A
    confidence: high
    sources:
      - title: CISA et al. - Foundations for OT Cybersecurity - Asset Inventory Guidance for Owners and Operators (August 2025)
        url: https://www.cisa.gov/resources-tools/resources/foundations-ot-cybersecurity-asset-inventory-guidance-owners-and-operators
        accessed: "2026-11-08"
        kind: government
        quote: "Conduct a physical inspection and logical survey by gathering detailed digital and network-based information about system components. Compile a comprehensive list of OT assets and network infrastructure dependencies."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Adopt mature asset management processes, including mapping data flows and access points."
        read: direct

  - id: base-passive-discovery
    control: Discover OT assets passively; schedule any active scanning for a planned outage
    category: asset-inventory
    priority: high
    why: >-
      NIST records a ping sweep that set a robotic arm moving and another that
      hung a wafer fab controller. ASD asks every OT team whether active discovery
      is acceptable at all.
    how: >-
      Use passive network monitoring (TAP/SPAN) for discovery and inventory. If
      active scanning is unavoidable, test the tool first and run it during a
      planned outage; NIST notes some OT tools learn passively before making
      device-specific queries.
    operational_impact: Active scans can destabilise devices or change process state; NIST ties them to planned outages.
    confidence: high
    sources:
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, Appendix E.2.3
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "OT network owners should exercise extreme caution when permitting active scanning on an operational network due to device sensitivity on the target network. Active scans may cause device instability or interfere with the device process state, potentially impacting safety and integrity. Active scans should be scheduled to occur during planned OT outages whenever possible."
        read: direct
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, Appendix C.3.4
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "While a ping sweep was being performed on an active SCADA network that controlled 9-foot robotic arms, one arm became active and swung around 180 degrees."
        read: direct
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "How to do asset discovery? Are active processes acceptable, or is passive the only way?"
        read: direct

  - id: base-connectivity-inventory
    control: Keep a connectivity inventory of every remote access point, including vendor devices and modems
    category: asset-inventory
    priority: high
    why: >-
      NSA and CISA note vendor access devices often phone home or sit unknown to
      the owner. A remote path that is not on the list cannot be monitored,
      rotated or cut off during an incident.
    how: >-
      Record each remote access point (VPN, jump host, vendor portal, cellular
      modem, dial-up), who uses it and how it is logged; make sure unused vendor
      access devices are inactive and cannot be covertly reactivated.
    confidence: high
    sources:
      - title: NSA, CISA - Control System Defense - Know the Opponent (AA22-265A)
        url: https://media.defense.gov/2022/Sep/22/2003083007/-1/-1/0/CSA_ICS_Know_the_Opponent_.PDF
        accessed: "2026-11-08"
        kind: government
        quote: "Creating a full “connectivity inventory” is a critical step in securing access to the system."
        read: direct
      - title: NSA, CISA - Control System Defense - Know the Opponent (AA22-265A)
        url: https://media.defense.gov/2022/Sep/22/2003083007/-1/-1/0/CSA_ICS_Know_the_Opponent_.PDF
        accessed: "2026-11-08"
        kind: government
        quote: "If the system does not use vendor access points and devices, ensure that none are active."
        read: direct

  # ------------------------------------------------------------ segmentation
  - id: base-it-ot-dmz
    control: Segment IT from OT and pass data between them through a DMZ
    category: segmentation
    priority: critical
    why: >-
      CISA, FBI, EPA and DOE say a DMZ for passing control data to enterprise
      systems reduces both the impact of threats and the risk of disruption; ASD
      treats the IT network as the higher-risk neighbour because of email and web
      browsing.
    how: >-
      Firewalled separation with a DMZ; no direct routing between corporate and
      industrial networks. ASD adds that OT should push data out rather than
      external networks pulling data in.
    frameworks:
      - CISA CPG 2.F
    confidence: high
    sources:
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Segmenting critical systems and introducing a demilitarized zone for passing control data to enterprise logistics reduces the potential impact of cyber threats and reduces the risk of disruptions to essential OT operations"
        read: direct
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "OT networks should push data out of the network, rather than external networks pulling data in from OT."
        read: direct

  - id: base-admin-from-ot-side
    control: Administer OT security and infrastructure only from a network of equal or higher trust, outside the corporate AD forest
    category: segmentation
    priority: high
    why: >-
      ASD's example: an IT-OT firewall managed by a privileged IT account stops
      protecting OT once the IT network is compromised. The same applies to OT
      virtualisation, backups and Active Directory trusts.
    how: >-
      Manage OT firewalls, hypervisors and backup infrastructure from the OT side
      with OT-only accounts; do not place OT in the IT AD forest or give it a
      trust relationship. No product syntax is published at this level.
    confidence: high
    sources:
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "a more critical environment should never be administered from a less critical environment, and should always be managed from a network with the same or higher security posture."
        read: direct
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "If the OT environment is inside the same AD Forest as the IT environment, or if a trust relationship exists, then the desired level of protection and operational separation for the OT environment may not be provided."
        read: direct

  - id: base-default-deny-perimeter
    control: Enforce default-deny inbound and outbound at the OT perimeter and block unneeded industrial ports between segments
    category: segmentation
    priority: high
    why: >-
      AA25-343A asks for default-deny and strict egress filtering against
      exfiltration and command-and-control callbacks; AA26-097A observed inbound
      traffic to PLCs on 44818, 2222, 102 and 502 and to modems on 22.
    how: >-
      Default-deny on OT perimeter firewalls with explicit allows for authorised
      destinations and protocols; block industrial protocol ports on external and
      internal firewalls wherever a segment does not need them; audit rulesets
      and watch outbound patterns for beaconing.
    confidence: high
    sources:
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Configure OT perimeter firewalls to enforce a default-deny policy for all traffic."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Implement strict egress filtering to prevent unauthorized data exfiltration or command-and-control callbacks."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Configure external and internal firewalls to block traffic using common ports associated with network protocols that are unnecessary for the particular network segment."
        read: direct

  - id: base-safety-network-separation
    control: Separate safety-critical OT networks (SIS) from less critical OT networks
    category: safety
    priority: critical
    why: >-
      ASD cites the 2017 HatMan (TRITON) malware as the reason safety networks
      need separating from other OT networks; NIST describes the SIS as an
      independent layer whose function a control-system failure must not affect.
    how: >-
      Keep the SIS on its own zone with tightly controlled conduits; where an
      integrated control and safety system is used, NIST notes the SIS must still
      meet IEC 61511. No vendor syntax at this level.
    blunts:
      - HatMan / TRITON (2017), as cited by ASD
    confidence: high
    sources:
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "Also well understood since 2017’s Hatman malware, is the need to separate more critical OT networks such as those essential to safety, from less critical OT networks."
        read: direct
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, section 2
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "An SIS is often independent from all other control systems in such a manner that a failure of the basic process control system (BPCS) will not impact SIS functionality in a deleterious manner."
        read: direct

  # ----------------------------------------------------------- remote access
  - id: base-brokered-remote-access
    control: Where remote access is essential, broker it through a VPN, gateway or jump host with phishing-resistant MFA
    category: remote-access
    priority: critical
    why: >-
      Many PLCs cannot do MFA; a gateway in front of them can, and it is also the
      place to stop repeated login attempts. CISA has given this advice in every
      PLC advisory since AA23-335A.
    how: >-
      Private IP connectivity or a VPN with a strong password and
      phishing-resistant MFA; a network proxy, gateway, firewall or VPN in front of
      the PLC with rules that stop brute-force attempts; a device control list of
      the workstations allowed to reach OT components. Each platform file gives
      the vendor's own product (for example Unitronics UCR routers, Siemens
      SINEMA Remote Connect).
    blunts:
      - AA23-335A CyberAv3ngers compromise of internet-facing Unitronics PLCs (2023)
      - AA26-097A Iranian-affiliated exploitation of internet-facing PLCs (2025-2026)
    frameworks:
      - CISA CPG 2.0 3.F
    confidence: high
    sources:
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "If remote access is essential, upgrade to a private IP network connection to remove these OT assets from the public internet and use virtual private network (VPN) functionality with a strong password and phishing-resistant multifactor authentication (MFA) for user remote access."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "A VPN or gateway device can enable MFA for remote access even if the PLC does not support MFA."
        read: direct
      - title: CISA - Exploitation of Unitronics PLCs used in Water and Wastewater Systems (alert, November 2023)
        url: https://www.cisa.gov/news-events/alerts/2023/11/28/exploitation-unitronics-plcs-used-water-and-wastewater-systems
        accessed: "2026-11-08"
        kind: government
        quote: "Require multifactor authentication for all remote access to the OT network, including from the IT network and external networks."
        read: direct

  - id: base-least-privilege-remote-access
    control: Grant remote access per asset and per task, time-limited, and disable dormant accounts
    category: remote-access
    priority: high
    why: >-
      Always-on vendor connections are a standing path in. AA25-343A recommends
      disabling exposure by default and opening it only for a limited time; NSA
      and CISA warn against vendor access devices running continuously without
      the owner seeing their logs.
    how: >-
      Document each remote access solution's scope (asset, role, task); open
      access for a window and close it afterwards; disable dormant accounts; keep
      vendor access devices off unless in use and their access logs visible to the
      owner. No product syntax at this level.
    frameworks:
      - CISA CPG 2.H
    confidence: high
    sources:
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Consider disabling public exposure by default and implementing time-limited remote access to reduce the amount of time systems are exposed."
        read: direct
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Further, disable dormant accounts."
        read: direct
      - title: NSA, CISA - Control System Defense - Know the Opponent (AA22-265A)
        url: https://media.defense.gov/2022/Sep/22/2003083007/-1/-1/0/CSA_ICS_Know_the_Opponent_.PDF
        accessed: "2026-11-08"
        kind: government
        quote: "Do not allow vendor-provided system access devices and software to operate continuously in the system without full awareness of their security posture and access logs."
        read: direct

  - id: base-cellular-modems
    control: Secure cellular modems used for field access with strong authentication, current firmware, logging and an isolated cellular architecture
    category: remote-access
    priority: high
    why: >-
      AA26-097A observed inbound traffic to modems on port 22 and, in one case,
      Dropbear SSH placed on victim modems for remote access. The advisory's
      mitigations add modem-specific steps. See remote-access-gateways.yml for
      vendor settings.
    how: >-
      Strong authentication and current firmware on every modem; modem logs
      enabled and reviewed; consider a private APN, 5G PNI-NPN, cellular SD-WAN,
      ZTNA or a site-to-site VPN instead of a publicly addressable modem.
    blunts:
      - AA26-097A Iranian-affiliated exploitation of internet-facing PLCs (2025-2026), including Dropbear SSH on victim modems
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Ensure cellular modems, used for remote field connectivity and access, are secured with strong authentication and updated."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "To mitigate unauthorized access to OT via cellular modems, organizations should consider implementing isolated architectures, such as private Access Point Name (APN), 5G Public Network Integrated Non-Public Network (PNI-NPN), cellular Software-Defined Wide Area Network (SD-WAN), Zero Trust Network Access (ZTNA), or a site-to-site virtual private network (VPN)."
        read: direct

  # ---------------------------------------------------------------- identity
  - id: base-no-default-passwords
    control: Change every default password on PLCs, HMIs, modems and remote access components to a strong, unique one
    category: identity
    priority: critical
    why: >-
      The 2023 Unitronics compromises used default or absent passwords, AA26-231A
      lists insecure default credentials among the S7 techniques, and CISA, FBI,
      EPA and DOE say the targeted systems used default or easily guessed
      passwords.
    how: >-
      Replace defaults at commissioning; unique per device; NSA and CISA add
      updating products with hard-coded passwords, especially remote access and
      security components. ASD suggests capturing and investigating failed login
      attempts once defaults are changed.
    blunts:
