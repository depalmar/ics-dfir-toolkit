        read: direct

  # --------------------------------------------------------- backup/recovery
  - id: base-offline-logic-backups
    control: Back up PLC logic and configurations and HMI logic, configuration and firmware, test restores, and keep copies offline and off-site
    category: backup-recovery
    priority: critical
    why: >-
      The logic is the best artefact a controller has and the only route back
      after it is altered; AA26-097A and AA25-343A both ask for tested backups
      for fast recovery.
    how: >-
      Back up logic, configurations and firmware; store files offline with the
      removable media physically secured; keep an alternate copy where the same
      incident cannot reach it; test restoration as part of contingency testing;
      list everything kept (installation media, licence keys, configuration).
    frameworks:
      - CISA CPG 2.0 3.O
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Store backup files offline and secure the physical removal media to enable fast recovery."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Create backups of the engineering logic, configurations, and firmware of HMIs to enable fast recovery."
        read: direct
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, section 6.2.4.3
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Establish an alternate secondary storage location for additional copies of backups to ensure that the same incident that disrupts the primary data cannot modify or destroy the backup"
        read: direct

  - id: base-trustworthy-backups
    control: Keep time-sequenced backups and verify a backup is free of malicious logic before restoring it
    category: backup-recovery
    priority: high
    why: >-
      A backup taken after the attacker's change reinstalls the attacker's logic.
      ASD asks whether backups can be trusted when an actor has been present for
      some time; AA26-097A says to verify before deployment.
    how: >-
      Backup-in-depth with time-sequenced layers (local, facility, disaster) so an
      older copy predating the intrusion exists; compare any backup against
      known-good engineering source before restoring.
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "If restoring from backups, verify the backup does not contain malicious logic before deployment."
        read: direct
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "That is, if a malicious actor has been on the network for a period of time, can the backups be trusted?"
        read: direct
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, section 5
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "A “backup-in-depth” approach with multiple layers of backups (e.g., local, facility, disaster) that are time-sequenced such that rapid recent local backups are available for immediate use and secure backups are available to recover from a massive security incident (e.g., ransomware attack) can help improve OT system availability."
        read: direct

  - id: base-cold-standby
    control: Keep cold-standby or replacement hardware and know each device's factory-reset and redeploy procedure
    category: backup-recovery
    priority: medium
    why: >-
      In 2023 the Unitronics actors changed device names, software versions and
      upload passwords so that operators could not reconnect; AA23-335A says only
      a matching software version or a factory reset resolved it.
    how: >-
      Retain spares of similar models; practise the factory reset and redeploy
      procedure for each controller family before an incident.
    frameworks:
      - CISA CPG 2.R
    confidence: high
    sources:
      - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (updated December 2024)
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
        accessed: "2026-11-08"
        kind: government
        quote: "Retain cold-standby or replacement hardware of similar models to ensure continued operations of critical functions if the primary system is compromised or unavailable"
        read: direct
      - title: CISA - Exploitation of Unitronics PLCs used in Water and Wastewater Systems (alert, November 2023)
        url: https://www.cisa.gov/news-events/alerts/2023/11/28/exploitation-unitronics-plcs-used-water-and-wastewater-systems
        accessed: "2026-11-08"
        kind: government
        quote: "Become familiar with the process for factory resetting and deploying configurations to a device in the event of being hit by ransomware."
        read: direct

  # ------------------------------------------------------------------ safety
  - id: base-manual-operations
    control: Practise and maintain the ability to run the process manually, and test fail-safe, islanding and standby systems
    category: safety
    priority: critical
    why: >-
      Manual operation is what keeps the service running while controllers are
      investigated; the 2023 Unitronics victim took its system offline and ran
      manually. CISA, FBI, EPA and DOE list it as a primary mitigation.
    how: >-
      Include manual-operation scenarios in business continuity and disaster
      recovery plans; routinely test fail-safe mechanisms, islanding, software
      backups and standby systems.
    operational_impact: Requires trained operators, staffing and exercises; it is a plant decision, not a security setting.
    frameworks:
      - CISA CPG 2.0 6.A
    confidence: high
    sources:
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Business continuity and disaster recovery plans, fail-safe mechanisms, islanding capabilities, software backups, and standby systems should all be routinely tested to ensure safe manual operations in the event of an incident."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Include scenarios that necessitate switching to manual operations."
        read: direct

  # ------------------------------------------------------------ supply chain
  - id: base-third-party-countermeasures
    control: Require integrators, service providers and vendors to apply these mitigations and tell them about active threats
    category: supply-chain
    priority: high
    why: >-
      Misconfigurations come from integrators, managed service providers and
      manufacturer defaults as well as the owner; service providers relying on
      internet connectivity may not know about current targeting.
    how: >-
      Confirm third parties apply the countermeasures to installed equipment;
      communicate directly about active threats, especially where they do remote
      monitoring or maintenance; share advisories with them.
    confidence: high
    sources:
      - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (updated December 2024)
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
        accessed: "2026-11-08"
        kind: government
        quote: "Confirm third-party vendors apply the above recommended countermeasures to mitigate exposure of these devices and all installed equipment."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Owners and operators should communicate directly with service providers to address risks, especially when remote monitoring or maintenance is involved."
        read: direct
      - title: CISA, FBI, EPA, DOE - Primary Mitigations to Reduce Cyber Threats to Operational Technology (May 2025)
        url: https://www.cisa.gov/sites/default/files/2025-05/fact-sheet-primary-mitigations-to-reduce-cyber-threats-to-operational-technology-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Misconfigurations may be introduced during standard operations, by the system integrator, by a managed service provider, or as part of the default product configuration by the system manufacturer."
        read: direct

  - id: base-secure-by-demand
    control: Buy OT products that ship without default passwords, log logins and changes, support MFA and authenticated backups
    category: supply-chain
    priority: medium
    why: >-
      Each of these features answers a gap that recent incidents exploited or that
      left responders without evidence. CISA's Secure by Demand fact sheet turns
      them into procurement questions.
    how: >-
      Ask the Secure by Demand questions during procurement: default passwords
      eliminated, older insecure protocols disabled by default, logging of
      logins, restarts and changes, MFA in the baseline version, authenticated
      backup and deployment of configurations and engineering logic.
    confidence: high
    sources:
      - title: CISA - Key Secure by Demand Elements for Operational Technology (fact sheet, 2025)
        url: https://www.cisa.gov/sites/default/files/2025-04/Priority-Considerations-for-OT-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Has the manufacturer eliminated default passwords? ... Are older insecure protocols disabled by default?"
        read: direct
      - title: CISA - Key Secure by Demand Elements for Operational Technology (fact sheet, 2025)
        url: https://www.cisa.gov/sites/default/files/2025-04/Priority-Considerations-for-OT-508c.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Does the product log logins, restarts, or changes to the product?"
        read: direct

  - id: base-device-provenance
    control: Know the provenance of every device on the OT network and accept only firmware that is signed and verified
    category: supply-chain
    priority: medium
    why: >-
      ASD notes that on a typically open OT network almost any device can see and
      inject control messages, so every device's supply chain matters, including
      vendor laptops.
    how: >-
      Track the source of all devices, including vendor and consultant laptops;
      receive firmware from a trusted location, check that it is cryptographically
      signed and verify the signature.
    confidence: high
    sources:
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "To aid protecting against third-party interference, entities should ensure that firmware is received from a trusted location, is cryptographically signed, and that the signature is checked."
        read: direct
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "The source and provenance of all devices in the OT environment should be known."
        read: direct

  # ------------------------------------------------------ incident readiness
  - id: base-ot-ir-plan
    control: Keep an OT-specific incident response plan, integrated with emergency and continuity plans, with a process engineer and an evidence-retention process
    category: incident-readiness
    priority: high
    why: >-
      Response in OT is a joint operations, engineering and security effort.
      ASD wants a process engineer in planning and in any containment or recovery;
      CISA, EPA and FBI want evidence preservation decided before the incident.
    how: >-
      Integrate OT playbooks with emergency, crisis and continuity plans and
      reporting obligations; prepare an information pack for third-party
      responders (contacts, naming conventions, data sources, tools that may be
      deployed); define how evidence is collected, stored and accessed; exercise
      and update the plans. See artifacts/response/baseline.yml.
    confidence: high
    sources:
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "The involvement of a process engineer is important, both when creating plans and playbooks and during any investigation, containment or recovery processes."
        read: direct
      - title: CISA, FBI, EPA - Incident Response Guide - Water and Wastewater Sector
        url: https://www.cisa.gov/sites/default/files/2024-10/WWS-Sector_Incident-Response-Guide.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "As a part of preparation, organizations should have a well-defined process for preserving data and evidence related to cyber incidents. This process should include clear guidelines for data collection, storage, and access."
        read: direct

  - id: base-cyber-aware-fault-triage
    control: Train operators and technicians to consider a cyber cause before resetting, rebooting or re-flashing a faulting device
    category: incident-readiness
    priority: medium
    why: >-
      ASD notes the usual engineering fixes reset communication links and wipe
      volatile memory, destroying evidence, and that cyber incidents may have been
      dismissed as operational faults.
    how: >-
      Add a cyber check to fault-handling procedures and change management; make
      it easy and blame-free for field staff to report suspicious behaviour,
      including unannounced remote sessions on HMIs.
    confidence: high
    sources:
      - title: ASD's ACSC et al. - Principles of operational technology cyber security (October 2024)
        url: https://www.cyber.gov.au/publication/principles-of-operational-technology-cyber-security
        accessed: "2026-11-08"
        kind: government
        quote: "Most, if not all, of the traditional remediation steps listed will reset communication links and wipe volatile memory, which may have helped a cyber security investigation."
        read: direct

notes: >-
  ISA/IEC 62443 is cited only where a free government source maps a control to
  it; the standard itself is paywalled and was not read. CPG ids are given as
  each source prints them: the May 2025 fact sheet and AA23-335A use the original
  CPG numbering (2.X, 2.F, 2.H, 2.R); AA25-343A and AA26-097A use CPG 2.0 numbering
  (3.S, 3.I, 3.F, 6.A). SANS "Five ICS Cybersecurity Critical Controls" was
  considered but not read directly (download not fetched); its controls overlap
  base-ot-ir-plan, base-it-ot-dmz, base-monitor-ot-traffic, base-brokered-remote-access
  and base-patch-in-windows-kev-first and add no claim not already sourced here.
