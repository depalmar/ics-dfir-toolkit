  # --------------------------------------------------- controller protection
  - id: base-run-mode
    control: Keep controller and safety-system key switches in RUN, and enable software programming protection where there is no physical switch
    category: controller-protection
    priority: critical
    why: >-
      AA26-097A's actors downloaded modified project files to PLCs remotely; a
      physical mode switch in RUN prevents remote modification on controllers
      that have one. NIST gives the same advice for PLCs and safety systems.
    how: >-
      Leave the physical switch in RUN; move it to PROGRAM or REMOTE only for an
      online download and return it to RUN immediately afterwards. For devices
      with a software key, enable programming protection in the configuration
      software (AA26-097A names S7 TIA Portal). Platform files give vendor detail.
    operational_impact: >-
      Changing mode locks in whatever project is currently downloaded, so
      AA26-097A asks owners to review and validate the project first. Remote
      downloads then require someone at the cabinet.
    blunts:
      - AA26-097A Iranian-affiliated exploitation of internet-facing PLCs (2025-2026)
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "For controllers with a physical mode switch, place the physical mode switch into run position to prevent remote modification."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Prior to switching the device to run mode, review and validate project files, as changing modes will lock in the current project file downloaded to the device."
        read: direct
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, section 5
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Keys of OT assets, like PLCs and safety systems, should be in the “Run” position at all times unless they are being actively programmed."
        read: direct

  - id: base-authenticate-controller-access
    control: Require authentication for every management session and for any change to a controller's mode, logic or files
    category: controller-protection
    priority: high
    why: >-
      Many controllers accept engineering connections from anyone who can reach
      them. AA23-335A and AA25-343A both ask that access be authenticated before
      state, logic or file changes are allowed.
    how: >-
      Use the controller's own authentication and role features (see platform
      files); limit operating-mode changes to authenticated roles; centralised
      authentication can help manage large numbers of field controller accounts.
    confidence: high
    sources:
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Authenticate all access to field controllers before authorizing access to, or modification of, a device’s state, logic, program, or filesystems."
        read: direct
      - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (updated December 2024)
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
        accessed: "2026-11-08"
        kind: government
        quote: "Use a role-based mechanism to limit operating mode changes to required authenticated users only."
        read: direct

  - id: base-controller-allowlist
    control: Allow only known engineering workstations and control devices to connect to each controller
    category: controller-protection
    priority: high
    why: >-
      AA26-097A's actors used the vendors' own programming software from leased
      hosting infrastructure. A controller or segment that accepts only expected
      peers refuses that connection even when the software is genuine.
    how: >-
      Firewall rules or the controller's own ACL feature allowing only expected
      control system devices; host-based allowlists so controllers connect only
      with known workstations; block hosting-provider and actor-controlled
      addresses. Platform files give vendor syntax.
    blunts:
      - AA26-097A Iranian-affiliated exploitation of internet-facing PLCs (2025-2026)
    frameworks:
      - CISA CPG 2.0 3.E
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Configure firewall rules or access control list (ACL) security features on PLCs or programmable controllers to allow only authorized communications between expected control system devices."
        read: direct
      - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (updated December 2024)
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
        accessed: "2026-11-08"
        kind: government
        quote: "Use host-based allowlists to prevent devices from accepting connections from unauthorized systems and ensure they can only connect with known workstations."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Establish an allowlist that permits only authorized device IP addresses and/or media access control addresses."
        read: direct

  # ---------------------------------------------------------------- services
  - id: base-disable-unused-services
    control: Disable unused authentication methods, features and services (Telnet, FTP, RDP, VNC, web) on OT devices
    category: services
    priority: high
    why: >-
      AA25-343A's hacktivists came in through exposed VNC; AA26-097A lists Telnet,
      FTP, RDP, VNC and web services as services to switch off when not needed.
      Siemens gives the same rule for automation components.
    how: >-
      Turn off every service not operationally required and account for those
      that remain in the security concept; block unused high ephemeral ports and
      watch for standard protocols on non-standard ports.
    blunts:
      - AA25-343A pro-Russia hacktivist VNC/HMI access (2024-2025)
    frameworks:
      - CISA CPG 2.0 3.R
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Disable any unused authentication methods, logic, or features, such as default authentication keys and passwords, as well as unused or needed services such as Teletype Network (Telnet), File Transfer Protocol (FTP), Remote Desktop Protocol (RDP), Virtual Network Computing (VNC), and web services."
        read: direct
      - title: Siemens - Cybersecurity for Industry Operational Guidelines v2.2.1
        url: https://cert-portal.siemens.com/operational-guidelines-industrial-security.pdf
        accessed: "2026-11-08"
        kind: vendor
        quote: "To minimize risks, only the services that are actually required should be activated on automation components."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Block all unused high ephemeral ports and monitor for attempted connections using standard protocols on non-standard ports"
        read: direct

  # ------------------------------------------------------ logging/monitoring
  - id: base-monitor-ot-traffic
    control: Capture and monitor OT network traffic for unusual logins and for protocol functions that change operating mode or modify programs
    category: logging-monitoring
    priority: high
    why: >-
      Most controllers keep little or no audit log, so passive capture is often
      the only record of who changed logic. Three joint advisories (AA23-335A,
      AA25-343A, AA26-097A) name the same two things to watch for.
    how: >-
      Passive capture and ICS-aware network intrusion detection at OT segment
      boundaries; alert on logins from the internet, unexpected protocols, and ICS
      management functions that change mode or download programs.
    confidence: high
    sources:
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "This includes unusual logins or unexpected protocols communicating over the internet, and functions of ICS management protocols that change an asset’s operating mode or modify programs."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Functions of industrial control systems management protocols that change an asset’s operating mode or modify programs."
        read: direct

  - id: base-remote-access-logs
    control: Keep remote access, modem and firewall logs off the device and review them continually
    category: logging-monitoring
    priority: high
    why: >-
      Remote access is the usual way in. NSA and CISA ask for continual review of
      remote access logs, and AA26-097A for modem logs, to detect intrusion and
      speed up response.
    how: >-
      Enable logging on VPNs, jump hosts, gateways and modems; aggregate it
      securely off the device; review for unexpected access, especially from the
      internet and outside operator hours.
    confidence: high
    sources:
      - title: NSA, CISA - Control System Defense - Know the Opponent (AA22-265A)
        url: https://media.defense.gov/2022/Sep/22/2003083007/-1/-1/0/CSA_ICS_Know_the_Opponent_.PDF
        accessed: "2026-11-08"
        kind: government
        quote: "Continually monitor remote access logs for suspicious accesses. Securely aggregate logs for easier monitoring."
        read: direct
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Enable logs for connected modems and regularly review for suspicious activity to detect intrusions and improve incident response speed."
        read: direct

  - id: base-time-sync
    control: Use one common time source for all OT devices, with a backup source, and keep unauthenticated NTP behind the firewall
    category: logging-monitoring
    priority: medium
    why: A timeline built from controller, HMI and firewall clocks that disagree puts events in the wrong order.
    how: >-
      A common time across OT devices from multiple sources; authenticated NTP
      or secure PTP where malicious time changes are a risk; unauthenticated NTP
      located behind the firewall.
    confidence: high
    sources:
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, section 6.2.12
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "A common time should be used across all OT devices. Utilizing multiple time sources can benefit OT devices by reducing clock error and providing backup time sources if the primary time source is lost or if the time quality of a primary time source has degraded."
        read: direct
      - title: NIST SP 800-82r3 - Guide to Operational Technology (OT) Security, section 6.2.12
        url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-82r3.pdf
        accessed: "2026-11-08"
        kind: government
        quote: "Non-authenticated NTP is susceptible to spoofing and should be located behind the firewall."
        read: direct

  # --------------------------------------------------------------- integrity
  - id: base-config-change-monitoring
    control: Monitor for device configuration changes and alert when setpoints or tag values leave their safe ranges
    category: integrity
    priority: high
    why: >-
      AA25-343A's actors changed setpoints from HMIs; AA26-097A's disabled
      shutdown and alarm logic. Knowing the expected values is how an unexpected
      change is noticed.
    how: >-
      Use asset or change management systems to record expected parameter
      settings and flag changes; configure alerting on setpoint and tag ranges.
      Platform files list vendor change-detection features.
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Monitor asset management systems for device configuration changes, which can be used to understand expected parameter settings."
        read: direct
      - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
        accessed: "2026-11-08"
        kind: government
        quote: "Review configurations for setpoint ranges or tag values to stay within safe ranges and establish alerting for deviations."
        read: direct

  - id: base-known-good-comparison
    control: Compare running controller logic, reusable modules and I/O configuration against a known-good copy with the vendor's integrity tools
    category: integrity
    priority: high
    why: >-
      AA26-097A's actors kept the downstream ladder logic working while adding
      logic that overrode safe operating parameters and modified Add-On
      Instructions. A logic comparison is the way to see that; a controller never
      compared has not been shown to be unmodified.
    how: >-
      Use the vendor's integrity or compare tools and a visual review against
      known-good logic; check reusable logic (for example Rockwell AOIs) and I/O
      configuration. Going online with engineering software needs operations
      approval.
    blunts:
      - AA26-097A Iranian-affiliated modification of PLC project logic and AOIs (2026)
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
        accessed: "2026-11-08"
        kind: government
        quote: "Use vendor-provided integrity checking tools and visually compare the running program to known good logic. Ensure reusable logic and input/output configurations are valid."
        read: direct

  - id: base-restrict-engineering-tools
    control: Limit engineering, configuration and diagnostic tools to the hosts and people that need them, and keep gold copies outside the system
    category: integrity
    priority: medium
    why: >-
      NSA and CISA call using the system against itself a powerful technique;
      AA26-231A's actors hid snap7-based scripts as monitoring tools.
    how: >-
      Identify engineering and diagnostic tools; store gold copies outside the
      system; remove non-critical tools, prevent reinstallation and audit for it.
      AA26-231A adds application allowlisting on engineering workstations.
    confidence: high
    sources:
      - title: NSA, CISA - Control System Defense - Know the Opponent (AA22-265A)
        url: https://media.defense.gov/2022/Sep/22/2003083007/-1/-1/0/CSA_ICS_Know_the_Opponent_.PDF
        accessed: "2026-11-08"
        kind: government
        quote: "Limit access to network and control system application tools and scripts to legitimate users performing legitimate tasks on the control system."
        read: direct
      - title: NSA, CISA, FBI, DOE, EPA AA26-231A - Defending Against an Active Threat to Siemens S7 Series PLCs
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-231a
        accessed: "2026-11-08"
        kind: government
        quote: "Implement application allowlisting on all engineering workstations"
        read: direct

  # ---------------------------------------------------------------- patching
  - id: base-patch-in-windows-kev-first
    control: Patch controllers and remote access components in planned downtime, tested first, and prioritise known exploited vulnerabilities
    category: patching
    priority: high
    why: >-
      AA26-231A's actors look for PLCs running outdated firmware. NSA and CISA ask
      for remote access points to be patched first.
    how: >-
      Install manufacturer patches in established downtime windows; take KEV
      entries outside the window where needed; test in a development environment
      first; prioritise internet-facing, DMZ and remote access devices.
    operational_impact: >-
      Downtime window, prior testing and often vendor support. Do not prioritise
      on CVSS alone (see CLAUDE.md).
    confidence: high
    sources:
      - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
        url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
