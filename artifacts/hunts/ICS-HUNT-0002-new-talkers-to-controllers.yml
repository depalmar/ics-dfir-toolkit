      When possible, implement a device control list for workstations sending
      messages or connecting to OT components.
    read: direct
  - title: CISA AA23-335A - IRGC-Affiliated Cyber Actors Exploit PLCs in Multiple Sectors (revised December 18, 2024), mitigations
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-335a
    accessed: "2026-11-08"
    kind: government
