# ICS hunt ICS-HUNT-0005
# Schema: ../schema/hunt.schema.json
# Research notes: docs/research/2026-11-08/detections.md

id: ICS-HUNT-0005
title: HMI alarm suppression, credential, device-name and setpoint changes during remote sessions
platforms: [ICS-0011]
actors: [ICS-TA-0010, ICS-TA-0011, ICS-TA-0012, ICS-TA-0013]
incidents: [ICS-INC-0007]
seen_in: [AA25-343A]
hypothesis: >-
  Someone driving an HMI's graphical interface remotely cleared or disabled
  alarms, changed setpoints or limits, renamed the device or changed HMI
  usernames and passwords to lock operators out.
data: [alarm-events, historian, remote-access, windows-events]
datasources: [ICS-DS-0010, ICS-DS-0011, ICS-DS-0005, ICS-DS-0006]
data_detail: >-
  The HMI/SCADA application's audit trail and alarm journal (for Ignition,
  the AUDIT_EVENTS table and the alarm_events table with eventtype 2
  acknowledgement and 5 disabled, as recorded in ICS-DS-0010; other HMI
  products' audit trails are not documented here); historian values of
  setpoints and limits; remote-session intervals from ICS-HUNT-0004.
  Auditing and alarm journaling must have been enabled beforehand.
method:
  - >-
    Export the HMI audit trail and alarm journal for the period from a
    replica or the central store, not by heavy queries on the live SCADA
    database.
  - >-
    Overlay the remote-session intervals from ICS-HUNT-0004 and the shift
    log.
  - >-
    Flag alarm disables, bulk acknowledgements or clears, setpoint and limit
    writes, user, password and role changes, and device-name changes that
    fall inside a remote session or have no matching shift-log entry.
  - >-
    Compare setpoints and alarm limits in the historian before and after
    each flagged interval against the documented safe ranges (AA25-343A asks
    for alerting on deviations).
  - >-
    Treat hacktivist screen recordings and claims as leads to the device and
    time only; CISA warns the groups exaggerate impact and misidentify
    victims.
normal: >-
  Alarm acknowledgements by the logged-in operator that match shift logs;
  setpoint changes inside documented ranges with a shift-log entry; account
  changes only by named administrators.
suspicious: >-
  Alarms disabled or mass-cleared during a remote session; setpoints driven
  to range limits; HMI passwords or device names changed; operators reporting
  they were locked out or lost view.
attack: [T0878, T0836, T0831, T0892, T0823, T0829]
inferred: >-
  The interval overlay is this toolkit's method. Note the HMI records the
  account that acted, not the network origin, so an intruder on VNC appears
  as the logged-in operator (ICS-DS-0010).
confidence: high
sources:
  - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure, Alarm Suppression
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Threat actors use HMI interfaces to clear alarms caused by their
      activity and alarms already present on the system at the time of their
      intrusion.
    read: direct
  - title: CISA AA25-343A, Change Credential
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Threat actors change the usernames and passwords of HMI devices in
      operator lockout attempts, usually resulting in a loss of view and
      operators switching to manual operations.
    read: direct
  - title: CISA AA25-343A, setpoint changes
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Once threat actors obtain access, they manipulate available settings
      from the graphical user interface (GUI) on the HMI devices, such as
      arbitrary physical parameter and setpoint changes, or conduct
      defacement activities.
    read: direct
  - title: CISA AA25-343A, mitigations
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Review configurations for setpoint ranges or tag values to stay within
      safe ranges and establish alerting for deviations.
    read: direct
  - title: CISA AA25-343A, claims
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      they regularly make false or exaggerated claims about their attacks on
      critical infrastructure to garner more attention.
    read: direct
