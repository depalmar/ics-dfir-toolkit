    accessed: "2026-11-08"
    kind: government
    quote: >-
      enumerate logs to search for successful logons using wevtutil.exe and
      the command Get-EventLog Security
    read: direct
  - title: Best practices for event logging and threat detection, anomalous behaviour examples
    url: https://www.cyber.gov.au/sites/default/files/2024-08/best-practices-for-event-logging-and-threat-detection.pdf
    accessed: "2026-11-08"
    kind: government
    quote: >-
