# ICS hunt ICS-HUNT-0012
# Schema: ../schema/hunt.schema.json
# Research notes: docs/research/2026-11-08/detections.md

id: ICS-HUNT-0012
title: The owner's own address ranges in internet exposure data - controller ports, VNC and modems
platforms: [ALL]
incidents: [ICS-INC-0005, ICS-INC-0007, ICS-INC-0009, ICS-INC-0010]
seen_in: [AA23-335A, AA25-343A, AA26-097A]
hypothesis: >-
  A controller, HMI or modem in the owner's address space - or in space an
  integrator, vendor or cellular provider set up for the owner - is
  reachable from the internet, which is the precondition every campaign in
  these advisories relied on.
data: [exposure-scan]
datasources: [ICS-DS-0014]
data_detail: >-
  Results already held by internet search platforms and attack-surface
  management services for the owner's ranges, and CISA Cyber Hygiene
  reports already delivered. Reading these is passive: nothing is sent to
  the plant.
method:
  - >-
    Assemble every public range in use, including the cellular addresses of
    modems and anything integrators or vendors installed.
  - >-
    Query existing search-platform and attack-surface-management results for
    those ranges for 102, 502, 2222, 20000, 20256, 20257, 44818, 4840,
    5900-5910, 22, 23 and web administration interfaces, and record the
    platform and query time with each result.
  - >-
    Do not run an active scan of a live control network from this hunt;
    the toolkit rates any active scanning of controllers process-risk, and
    ICS-DS-0014 rates Cyber Hygiene enrolment the same way where controllers
    are directly exposed.
  - >-
    For anything exposed with a weak or default password, follow AA25-343A
    and assume compromise: start incident response rather than just closing
    the port.
normal: >-
  No controller, HMI, VNC or modem management service from the owner's
  ranges appears in exposure data.
suspicious: >-
  Any industrial protocol port, VNC or modem administration interface
  exposed; cellular addresses not in the inventory; exposure that appeared
  recently.
attack: [T0883]
inferred: >-
  The port list combines the ports named in AA26-097A, AA25-343A and
  AA23-335A with the parser defaults in ICS-DS-0001; it is this toolkit's
  list, not CISA's.
confidence: high
