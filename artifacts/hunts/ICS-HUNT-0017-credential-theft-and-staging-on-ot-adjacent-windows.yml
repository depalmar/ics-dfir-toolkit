# ICS hunt ICS-HUNT-0017
# Schema: ../schema/hunt.schema.json
# Research notes: docs/research/2026-11-08/detections-round3.md

id: ICS-HUNT-0017
title: Credential dumping, kernel-driver abuse, staging and remote-session reuse on EWS, HMI and OT-adjacent Windows hosts
platforms: [ICS-0010, ICS-0011, ICS-0013]
actors: [ICS-TA-0007, ICS-TA-0005]
malware: [ICS-MAL-0007]
hypothesis: >-
  An intruder positioned to reach OT is collecting credentials and access on
  the Windows hosts that administer it - dumping LSASS, loading a vulnerable
  driver to run kernel code, reading stored remote-session profiles, staging
  data in archives - and entering through the site's own VPN or remote
  access, all of which leave records on hosts and gateways the owner already
  logs.
data: [windows-events, edr, remote-access, firewall, identity]
datasources: [ICS-DS-0006, ICS-DS-0005, ICS-DS-0004, ICS-DS-0012]
data_detail: >-
  Process creation with command lines (Sysmon Event ID 1 or Security 4688),
  Sysmon driver-load (Event ID 6) and file-creation (Event ID 11) events, and
  EDR telemetry from engineering workstations, HMIs, OT jump hosts and the
  domain controllers of any OT domain; Security 4624 logons; VPN and
  remote-access gateway logs (ICS-DS-0005, ICS-DS-0012); boundary firewall
  logs for the IT/OT conduit.
method:
  - >-
    Credential dumping: search process creation for comsvcs.dll with its
    MiniDump export (AA24-038A's LSASS method), wherever the DLL sits - the
    actors brought an outdated copy into a non-standard folder - and for files
    normally found in System32 appearing in temporary or user folders.
  - >-
    Kernel-driver abuse: list driver loads (Sysmon Event ID 6) on EWS and HMIs
    and flag AsrDrv103.sys, or any ASRock-signed driver on a host with no
    ASRock board, as CISA recommends for the INCONTROLLER/PIPEDREAM driver
    exploit (CVE-2020-15368).
  - >-
    Remote-session reuse: look for processes reading stored PuTTY sessions or
    other saved remote-administration profiles on hosts that hold profiles
    for OT systems, and for those profiles being used soon after from an
    unusual host. AA24-038A found such profiles for water treatment plants,
    wells and a substation on a server next to OT.
  - >-
    Staging: list archive creation by 7-Zip, WinRAR, rar or tar on these
    hosts, password-protected archives (Microsoft), and archivers running
    under another name - compare the image name with the original file name
    or hash Sysmon records, since AA24-038A's actors ran rar.exe renamed
    ronf.exe. Project-file archiving is covered by ICS-HUNT-0008.
  - >-
    Entry: match VPN and remote-access sessions to the conduit with the
    people who own the accounts - source address, time of day, MFA result -
    and with the jump-host logons that follow; AA24-038A reports VPN sessions
    as the actors' persistent way in, and Microsoft reports sign-ins "from
    unusual IP addresses".
normal: >-
  No comsvcs MiniDump use; driver loads match each host's hardware baseline;
  remote-session profiles used only by their owners from their usual hosts;
  archives created by backup jobs and named engineers; VPN sessions from
  known users, addresses and hours.
suspicious: >-
  LSASS dumped by any means; AsrDrv103.sys on an HMI or EWS; a stored-session
  enumeration followed by a session to an OT system from a new host;
  password-protected or renamed-archiver output on an OT-adjacent host; VPN
  sessions at unusual hours or from hosting providers by accounts that also
  appear on jump hosts.
attack: [T1003.001, T0866, T1563, T1560, T1133]
rules:
  - 01-engineering-workstations/ews_hmi_lsass_dump_via_comsvcs_minidump.yml
  - 01-engineering-workstations/ews_hmi_asrock_vulnerable_driver_loaded.yml
inferred: >-
  Applying Volt Typhoon's reported IT-side tradecraft and INCONTROLLER's
  driver exploit to the Windows hosts that administer OT, and correlating them
  with the OT conduit's remote-access logs, is this toolkit's scoping; the
  behaviours and the monitoring recommendations are the sources' own.
confidence: high
