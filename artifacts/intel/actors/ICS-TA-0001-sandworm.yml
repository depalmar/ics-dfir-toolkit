reported_by:
  - US Department of Justice (2020 indictment of GRU Unit 74455 officers)
  - Mandiant / Google Threat Intelligence Group
  - ESET
  - FBI, CISA, NSA and partners (AA25-343A names GRU military unit 74455 as tracked under Sandworm Team, Voodoo Bear, Seashell Blizzard, APT44)
link_confidence: high
stated_confidence: >-
  ESET (Industroyer2, April 2022): 'We assess with high confidence that the APT
  group Sandworm is responsible for this new attack'. ESET (DynoWiper, Poland,
  December 2025): 'We attribute DynoWiper to Sandworm with medium confidence' and
  'we only attribute the data-wiping component of this activity to Sandworm with
  medium confidence'. Mandiant (2024): 'Sponsored by Russian military
  intelligence, APT44 is a dynamic and operationally mature threat actor'. US DOJ
  (2020) charged six 'officers in Unit 74455 of the Russian Main Intelligence
  Directorate (GRU)' with, among other acts, 'December 2015 through December 2016
  destructive malware attacks against Ukraine’s electric power grid, Ministry of
  Finance, and State Treasury Service, using malware known as BlackEnergy,
  Industroyer, and KillDisk'.
state_nexus: >-
  Russia: GRU Main Center for Special Technologies (GTsST), military unit 74455.
  This is the unit the 2020 DOJ indictment charges. Mandiant: 'Government
  indictments have linked the group to the Main Center for Special Technologies
  (also known as GTsST and Military Unit 74455)'.
motivation: mixed
summary: >-
  Russian military-intelligence group that Mandiant says works across 'the full
  spectrum of espionage, attack, and influence operations'. DOJ charged its
  officers over the 2015-2016 attacks on Ukraine's grid (BlackEnergy, Industroyer,
  KillDisk). ESET attributes, with high confidence, the April 2022 Industroyer2
  attempt against high-voltage substations in Ukraine: Industroyer2 spoke only
  IEC-104, and Linux and Solaris wipers and CaddyWiper were scheduled around it.
  Mandiant describes a 2022 attack in which Sandworm used MicroSCADA's own scilc.exe
  to run SCIL commands that likely opened substation breakers, followed two days
  later by CaddyWiper in IT. ESET attributes the December 2025 DynoWiper deployment
  at a Polish energy company to Sandworm with medium confidence, for the wiper only.
  It found no OT functionality in DynoWiper, and says another group may have done
  the initial access. Dragos tracks related activity as its own clusters (ELECTRUM,
  KAMACITE) and does no political attribution, so those are separate records.
ics_kill_chain_stage: unknown
stage_basis: >-
  None of the reporters cited here places Sandworm on the SANS/Dragos ICS Cyber
  Kill Chain. Mandiant reports an executed OT effect ('we are aware that the
  attack resulted in an unscheduled power outage') without a stage label. Dragos
  stages its own clusters (ELECTRUM, KAMACITE), not Sandworm.
platforms: [ICS-0011, ICS-0014]
malware: [ICS-MAL-0003, ICS-MAL-0004, ICS-MAL-0006, ICS-MAL-0013]
incidents: [ICS-INC-0001, ICS-INC-0002, ICS-INC-0004, ICS-INC-0008]
iocs: [ICS-IOC-0002]
tradecraft:
  - "Malware (ESET): Industroyer2 'only implements the IEC-104 (aka IEC 60870-5-104) protocol to communicate with industrial equipment'. Each build carries a hardcoded configuration (device IP addresses, ASDU address, information object addresses), so it is recompiled per victim."
  - "Malware (ESET): before connecting to targets, Industroyer2 'terminates a legitimate process that is used in standard daily operations' and renames it with a .MZ suffix so it does not restart."
  - "Hands-on operator (ESET timeline, 2022-04-08): 'Sandworm operator creates the scheduled task to launch Industroyer2'. CaddyWiper was then scheduled on the same machine to erase traces."
  - "Malware (ESET): CaddyWiper was deployed alongside Industroyer2, which ESET believes was 'intended to slow down the recovery process and prevent operators of the energy company from regaining control of the ICS consoles'. Bash wipers (ORCSHRED, SOLOSHRED, AWFULSHRED) hit the Linux and Solaris hosts."
  - "Hands-on operator (Mandiant, 2022): reached OT through a hypervisor hosting a MicroSCADA instance, then mounted an ISO ('a.iso') that ran lun.vbs and n.bat, which likely ran the native scilc.exe with a SCIL program file. Mandiant: 'we believe they were probably commands to open circuit breakers'."
  - "Hands-on operator (Mandiant): deployed CaddyWiper through Group Policy using TANKTRAP, a PowerShell utility, and removed forensic artifacts from the SCADA system."
  - "Script / hands-on operator (ESET, 2025): DynoWiper was deployed through an Active Directory Group Policy deployment script resembling the one used for Sandworm's ZOV wiper. DynoWiper samples 'focus solely on the IT environment, with no observed functionality targeting OT'."
attack: [T0847, T0807, T0871, T0853, T0872, T0809, T0855, T0831, T1561.001, T1053.005]
