notes: >-
  ELECTRUM and KAMACITE are Dragos clusters with stated overlaps only. They are
  not merged here (see ICS-TA-0002, ICS-TA-0003). The December 2025 Poland
  incident has two attributions: ESET says Sandworm (medium, wiper component
  only); Dragos says ELECTRUM. ESET adds that 'the preparatory stages leading up to
  the destructive activity may have been conducted by another threat actor group
  collaborating with Sandworm'. A third reporter, CERT Polska, ties the attack
  infrastructure to the 'Static Tundra' / 'Berserk Bear' / 'Ghost Blizzard' /
  'Dragonfly' cluster (ICS-TA-0017). AA25-343A
  also assesses that GRU unit 74455 'is likely responsible for supporting the
  creation of CARR'; CARR is its own record (ICS-TA-0010), not an alias. Protocols
  (IEC 60870-5-104; Industroyer's IEC-101, IEC-104, IEC 61850 and OPC DA per ESET)
  are named in text only until protocol records exist. Mandiant's full APT44
  report (PDF) was not read; nothing here rests on it.
