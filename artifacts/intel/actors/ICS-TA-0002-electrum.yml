notes: >-
  ELECTRUM is not Sandworm. Dragos states overlap only, and its own pages differ
  in emphasis: the threat page says 'now appears independent', the 2026 press
  release 'shares technical overlaps with Sandworm'. Both are kept verbatim. For
  the same Poland incident (December 2025), ESET attributes the DynoWiper
  component to Sandworm with medium confidence. That is a different reporter's
  cluster and is recorded on ICS-TA-0001, not here. CERT Polska, a third reporter,
  ties the attack infrastructure to the 'Static Tundra' / 'Berserk Bear' /
  'Dragonfly' cluster (ICS-TA-0017). The three attributions diverge, and the
  toolkit prefers none. Protocols are named in text only until protocol records exist. Dragos
  publishes full TTPs only to WorldView customers, so tradecraft here is limited to
  public pages.
