id: ICS-TA-0002
name: ELECTRUM
aliases:
  - name: Sandworm
    by: >-
      Dragos ('ELECTRUM shares technical overlaps with Sandworm', 2026; the threat
      page says 'Dragos associates ELECTRUM with the SANDWORM Advanced Persistent
      Threat (APT)' and 'Assessed links with SANDWORM APT, now appears
      independent'). Its own record, ICS-TA-0001 in this toolkit.
    equated: false
reported_by: [Dragos]
link_confidence: medium
stated_confidence: >-
  Dragos gives no confidence language for the cluster. It states: 'ELECTRUM is the
  activity group responsible for the 2016 power outage event caused by the ICS
  malware CRASHOVERRIDE' and (2026 Year in Review) 'In December 2025, ELECTRUM
  targeted combined heat and power (CHP) facilities and renewable energy
  management systems in Poland with deliberate attempts to impact operational
  assets'.
state_nexus: >-
  None stated. Dragos 'does not corroborate nor conduct political attribution to
  threat activity'.
motivation: disruption
summary: >-
  Dragos's cluster for the control-system part of the December 2016 Kyiv power
  outage (CRASHOVERRIDE, which ESET calls Industroyer). Dragos says ELECTRUM moved
  from a development role supporting earlier Sandworm activity into 'both a
  development and operational role in the CRASHOVERRIDE incident'. Dragos's 2026
  Year in Review reports 2025 destructive operations: an attack on eight Ukrainian
  ISPs in May, new wiper variants, and the December 2025 targeting of Polish CHP
  plants and renewable-energy management systems. Dragos calls that 'an expansion
  beyond transmission infrastructure to the decentralized grid'. Dragos says
  KAMACITE enables ELECTRUM's operations.
ics_kill_chain_stage: unknown
stage_basis: >-
  The Dragos pages read give no stage label for ELECTRUM. The ICS impact they list
  is 'Executed control system portion of 2016 Ukraine power event, deployed
  CRASHOVERRIDE designed to manipulate electric transmission equipment'.
platforms: [ICS-0014]
malware: [ICS-MAL-0004]
incidents: [ICS-INC-0002, ICS-INC-0008]
tradecraft:
  - "Hands-on operator (Dragos): 'used Microsoft SQL database servers as the gateway that bridges both the business and industrial control networks, to successfully compromise industrial control systems where they used stolen credentials to execute code'."
  - "Hands-on operator (Dragos): 'The group does not rely on exploits or zero-day vulnerabilities and instead leverages common exploitation behaviors and methodology.'"
  - "Malware (Dragos): CRASHOVERRIDE, 'designed to manipulate electric transmission equipment'. Dragos's CHERNOVITE page adds: 'CRASHOVERRIDE and the associated Activity Group, ELECTRUM, exploited the OPC-DA protocol to manipulate breakers and switch gear.'"
  - "Malware (Dragos capabilities list): 'Unique RAT & malicious wiper modules'. 2025: 'deployment of new wiper malware variants'."
  - "Infrastructure (Dragos): 'Leveraged servers hosting many additional services such as TOR'."
sectors: [electric]
regions: [Ukraine, Europe, Poland]
first_seen: "2016 (Dragos: 'Since 2016')"
last_seen: "2025-12 (Dragos: Poland CHP and renewable energy management systems)"
references:
