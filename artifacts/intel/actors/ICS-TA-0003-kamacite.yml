    read: direct
notes: >-
  BlackEnergy (ICS-MAL-0003) is not listed under malware. Dragos says KAMACITE
  'facilitated' the BLACKENERGY2 campaign, which does not say KAMACITE deployed
  the malware. ICS-0013 is listed because Dragos names cellular gateways among the
  devices scanned in 2025; the gateway vendors are not named. KAMACITE is not
  Sandworm; Dragos states overlap only.
