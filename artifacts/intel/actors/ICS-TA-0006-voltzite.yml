notes: >-
  VOLTZITE is not Volt Typhoon. Reporters conflict on the relationship: US
  agencies (AA24-038A, February 2024) list 'Voltzite' as another name for Volt
  Typhoon, while Dragos describes 'operational overlaps' and 'technical overlaps'.
  The toolkit follows the naming party and keeps two records. The
  Stage 2 elevation and Sierra Wireless detail come from the press release; the
  full Year in Review report was not read.
