notes: >-
  The reporters frame motivation differently. Microsoft (2023) calls Volt Typhoon
  an actor that 'typically focuses on espionage and information gathering'.
  AA24-038A (2024) says its behaviour 'is not consistent with traditional cyber
  espionage' and assesses pre-positioning with high confidence. The record uses
  the agencies' later assessment and keeps both quotes. VOLTZITE is a separate
  Dragos record. UNC3236 is a further conflict: AA24-038A lists it as a Volt
  Typhoon name, while Dragos lists UNC3236 among the overlaps of SYLVANITE
  (ICS-TA-0014). ATT&CK ids are the advisory's own mapping where read (T1133,
  T1563, T1560) plus T1003.001, which Microsoft links for LSASS dumping.
