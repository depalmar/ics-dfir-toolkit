notes: >-
  BAUXITE is not CyberAv3ngers. The reporters conflict: CISA's AA26-097A says
  'Private industry and open sources also refer to this group as ... Bauxite' of
  CyberAv3ngers, while Dragos, the naming party, states overlap only. The toolkit
  follows the naming party. Dragos's MQTT backdoor and Claroty's IOCONTROL (which
  also uses MQTT) are not linked here. No reporter read equates them, and the
  toolkit does not compute attribution. The CyberAv3ngers Unitronics incident
  (ICS-INC-0005) is not listed: Dragos's pages read do not tie BAUXITE to it.
