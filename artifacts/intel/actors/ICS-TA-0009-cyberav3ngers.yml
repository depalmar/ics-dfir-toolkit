notes: >-
  ICS-INC-0009 (AA26-097A) is deliberately not listed. That advisory attributes
  the 2026 activity to 'a group of Iranian-affiliated APT actors' and cites
  CyberAv3ngers only as 'similar activity' (see ICS-TA-0019). On aliases, names
  the US agencies give as other names for this group are equated, as the
  agencies' statement. Dragos's BAUXITE is not, because the naming party states
  overlap only. Soldiers of Solomon is not, because AA23-335A and AA26-097A differ.
  CVE-2023-6448 is listed because Microsoft states a CVE 'was assigned for the
  Unitronics default password configuration' after these incidents. The IOCONTROL
  link (ICS-MAL-0011) rests on Claroty alone and is hedged ('allegedly').
  ATT&CK ids are AA23-335A's own mapping.
