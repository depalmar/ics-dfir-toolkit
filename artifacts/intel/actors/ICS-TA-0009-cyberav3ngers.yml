reported_by:
  - FBI, CISA, NSA, EPA, Israel National Cyber Directorate, CCCS and NCSC-UK (AA23-335A)
  - US Department of the Treasury (OFAC)
  - Microsoft Threat Intelligence
  - Claroty Team82
link_confidence: high
stated_confidence: >-
  FBI, CISA, NSA, EPA, INCD, CCCS and NCSC-UK (AA23-335A): 'In November 2023,
  IRGC-affiliated cyber actors using the persona “CyberAv3ngers” began actively
  targeting and compromising Israeli-made Unitronics Vision Series programmable
  logic controllers (PLCs) and human machine interfaces (HMIs).' The update gives
  TTPs 'the authoring agencies assess are likely associated with this
  IRGC-affiliated APT'. Treasury: action 'in response to IRGC-affiliated cyber
  actors’ recent cyber operations in which they hacked and posted images on the
  screens of programmable logic controllers manufactured by Unitronics'. Claroty
  is hedged on IOCONTROL: the sample came from 'a fuel management system that was
  allegedly compromised by a threat actor group linked to Iran known as the
  CyberAv3ngers'.
state_nexus: >-
  Iran: IRGC Cyber-Electronic Command (IRGC-CEC). AA26-097A calls CyberAv3ngers 'a
  cyber threat actor affiliated with Iran’s Islamic Revolutionary Guard Corps
  (IRGC) Cyber Electronic Command (CEC)'. Treasury sanctioned six IRGC-CEC
  officials over the Unitronics operations.
motivation: disruption
summary: >-
  IRGC-affiliated persona behind the November 2023 to January 2024 compromise of
  at least 75 internet-exposed Unitronics Vision Series PLC/HMIs, at least 34 of
  them in US water and wastewater. The actors got in with default or no
  passwords on TCP 20256. They replaced the ladder logic with their own, which had
  no inputs or outputs, renamed devices, rolled back software versions, disabled
  upload and download, changed the port, and put a defacement splash page on the
  HMI. AA23-335A notes several of its Israeli claims were false. Claroty attributes
  IOCONTROL, an MQTT-controlled implant found on Orpak/Gasboy fuel systems, to
  CyberAv3ngers, hedged as 'allegedly'. The 2026 PLC campaign in AA26-097A is
  attributed to an unnamed Iranian-affiliated group, not to CyberAv3ngers. It is
  recorded separately as ICS-TA-0019.
ics_kill_chain_stage: unknown
stage_basis: "Neither the US agencies nor Microsoft nor Claroty use the ICS Cyber Kill Chain for this persona."
platforms: [ICS-0006]
malware: [ICS-MAL-0011]
incidents: [ICS-INC-0005]
cves: [CVE-2023-6448]
tradecraft:
  - "Hands-on operator (AA23-335A): compromised Unitronics Vision devices 'by authenticating to internet-connected devices with communications set to the default TCP port 20256'. The devices 'either had a default password in place or no password'."
  - "Hands-on operator (AA23-335A): 'erased the original ladder logic file on the device and downloaded their own'. The replacement 'contained no inputs or outputs', and the actors 'did not burn their ladder logic file to the device, preventing the retrieval of the ladder logic file from the device'."
  - "Hands-on operator (AA23-335A): renamed devices; set the ladder logic software version to an older version; disabled upload and download; enabled password protection for upload; changed the remote port 'from 20256 to 20257'; uploaded a defacement splash page to the HMI."
  - "Hands-on operator (AA23-335A): 'developed custom ladder logic files to download for each of these device types'."
  - "Claimed (AA23-335A): 'Since 2020, CyberAv3ngers has claimed responsibility for cyberattacks in Israel, although several of these claimed compromises of critical infrastructure organizations in Israel are false.'"
  - "Malware (Claroty, attribution hedged): IOCONTROL on Orpak/Gasboy fuel management systems; C2 over MQTT on port 8883. CyberAv3ngers claimed on Telegram 'it had attacked 200 gas stations in Israel and the U.S.' (claimed)."
attack: [T1110, T1078.001, T1565.001, T1531, T1499, T1491.001]
sectors:
  - "water and wastewater systems (AA23-335A: at least 34 compromised devices in the WWS Sector)"
  - "energy (AA23-335A: claimed attacks 'primarily in the water and energy sectors')"
  - "fuel management systems (Claroty: Orpak and Gasboy)"
regions: [United States, Israel, United Kingdom]
victimology:
  - "At least 75 Unitronics devices compromised, including at least 34 in the US water and wastewater sector (AA23-335A)"
first_seen: "2020 (AA23-335A: claims in Israel 'Since 2020')"
last_seen: "2024-01 (AA23-335A: US Unitronics waves November 2023 to January 2024); Claroty reports an IOCONTROL campaign relaunched 'in July and August' 2024"
