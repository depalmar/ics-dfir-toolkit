reported_by:
  - FBI, CISA, NSA, DOE, EPA, DC3, Europol EC3, Eurojust and international partners (AA25-343A)
  - US Department of the Treasury (OFAC)
link_confidence: high
stated_confidence: >-
  AA25-343A authoring organizations: 'The authoring organizations assess that the
  Russian General Staff Main Intelligence Directorate (GRU) Main Center for
  Special Technologies (GTsST) military unit 74455 ... is likely responsible for
  supporting the creation of CARR'. Treasury (July 2024): 'Using various
  unsophisticated techniques, CARR has been responsible for manipulating
  industrial control system equipment at water supply, hydroelectric, wastewater,
  and energy facilities in the U.S. and Europe.'
state_nexus: >-
  Russia. AA25-343A: GRU unit 74455 'is likely responsible for supporting the
  creation of CARR', and actors suspected to be from that unit 'likely funded the
  tools CARR threat actors used to conduct distributed denial-of-service (DDoS)
  attacks through at least September 2024'. By late September 2024 CARR
  administrators 'became dissatisfied with the level of support and funding
  provided by the GRU'. Treasury calls CARR a 'Russian government-aligned
  hacktivist group'.
motivation: hacktivism
summary: >-
  Pro-Russia hacktivist group created in early 2022 with, the authoring agencies
  assess, GRU unit 74455 support. It ran DDoS attacks first, then from late 2023
  ICS intrusions through internet-exposed, weakly secured HMIs, mostly over VNC.
  Treasury says CARR manipulated ICS equipment at water, hydroelectric, wastewater
  and energy facilities in the US and Europe. It records CARR's claim of the
  January 2024 water-tank overflows in Abernathy and Muleshoe, Texas, and
  CARR's compromise of a US energy company's SCADA system. AA25-343A says such
  groups 'regularly make false or exaggerated claims'. CARR administrators later
  co-founded Z-Pentest (ICS-TA-0011) with a NoName057(16) administrator.
ics_kill_chain_stage: unknown
stage_basis: "Neither Treasury nor AA25-343A uses the ICS Cyber Kill Chain."
platforms: []
malware: []
incidents: [ICS-INC-0007]
tradecraft:
  - "Hands-on operator (AA25-343A, describing the pro-Russia groups collectively): scan for VNC on 'the default port 5900 or other nearby ports (5901-5910)' with tools 'such as Nmap or OPENVAS', then password-spray known default or weak credentials."
  - "Hands-on operator (AA25-343A, collectively): through the HMI GUI, modify usernames and passwords, parameters, device names and instrument settings; disable alarms; create loss of view; restart or shut down devices; record the screen for publicity."
  - "Claimed (AA25-343A): 'claiming an intrusion against a European wastewater treatment facility in October 2023'; 'In November 2023, CARR targeted human-machine interface (HMI) devices, claiming intrusions at two U.S. dairy farms.'"
  - "Claimed, with Treasury-stated impact (Treasury): 'In January 2024, CARR claimed responsibility for the overflow of water storage tanks in Abernathy and Muleshoe, Texas'. Treasury states 'The compromise of the industrial control systems resulted in the loss of tens of thousands of gallons of water.'"
  - "Hands-on operator (Treasury): a CARR member 'was behind the compromise of the SCADA system of a U.S. energy company' and in May 2024 'developed training materials on how to compromise SCADA systems'."
  - "Claimed (AA25-343A): 'In July 2024, NoName057(16) jointly claimed responsibility with CARR for an alleged intrusion against OT assets in the U.S.'"
