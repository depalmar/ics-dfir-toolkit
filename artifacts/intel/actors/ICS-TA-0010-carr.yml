notes: >-
  CARR is not Sandworm or APT44. The agencies assess GRU unit 74455 'supporting
  the creation' of CARR, which is a state-nexus statement, not an equation.
  AA25-343A's TTPs and ATT&CK mapping describe 'pro-Russia hacktivist groups'
  collectively (CARR, Z-Pentest, NoName057(16), Sector16), not CARR alone. The
  advisory warns these groups 'frequently misrepresent their capabilities and the
  impacts of their actions'. Every impact here is marked claimed unless a
  government states it. Mandiant's APT44 report also discusses CARR, but its PDF
  was not read. HMI vendors and platforms are not specific in the sources, so no
  platform id is listed.
