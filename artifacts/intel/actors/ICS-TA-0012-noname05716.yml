link_confidence: high
stated_confidence: >-
  AA25-343A authoring organizations: 'The authoring organizations assess that the
  Center for the Study and Network Monitoring of the Youth Environment (CISM),
  established on behalf of the Kremlin, created NoName057(16) as a covert project
  within the organization.' Europol: 'Investigations by national authorities
  identified NoName057(16) as an ideological criminal network that has been seen
  to profess support to the Russian Federation'.
state_nexus: >-
  Russia. AA25-343A: CISM, 'established on behalf of the Kremlin', created the
  group, and CISM staff 'developed and customized the NoName057(16) proprietary
  DDoS tool DDoSia, paid for the group’s network infrastructure, served as
  administrators on NoName057(16) Telegram channels, and selected DDoS targets'.
  Europol describes an ideological criminal network and does not state state
  sponsorship.
motivation: hacktivism
summary: >-
  Pro-Russia DDoS network active since March 2022. It targets Ukraine and NATO and
  European states using its DDoSia tool and volunteers paid in cryptocurrency.
  Europol says it is made up mainly of 'Russian-speaking sympathisers who use
  automated tools' who are 'motivated by ideology and rewards'. Its ICS relevance
  is collaborative: a joint CARR chat by mid-2024, a July 2024 joint claim with
  CARR of an alleged intrusion against US OT assets, and co-founding Z-Pentest
  (ICS-TA-0011). Europol's Operation Eastwood took a major part of its central
  infrastructure offline. That action ran from 14 to 17 July and included arrest
  warrants and over 100 servers disrupted.
ics_kill_chain_stage: unknown
stage_basis: "Neither AA25-343A nor Europol uses the ICS Cyber Kill Chain."
