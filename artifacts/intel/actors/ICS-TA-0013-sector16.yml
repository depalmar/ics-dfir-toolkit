id: ICS-TA-0013
name: Sector16
aliases: []
reported_by:
  - FBI, CISA, NSA, DOE, EPA, DC3, Europol EC3, Eurojust and international partners (AA25-343A)
link_confidence: medium
stated_confidence: >-
  AA25-343A authoring organizations: 'Formed in January 2025, Sector16 is a novice
  pro-Russia hacktivist group that emerged through collaboration with Z-Pentest.'
  They add: 'Members of Sector16 may have received indirect support from the
  Russian government in exchange for conducting specific cyber operations that
  further Russian strategic goals.'
state_nexus: >-
  Possible indirect Russian government support. AA25-343A: 'may have received
  indirect support from the Russian government'.
motivation: hacktivism
summary: >-
  Novice pro-Russia hacktivist group formed in January 2025 with Z-Pentest. It
  posts videos, statements and claims of compromising US energy infrastructure on a
  public Telegram channel. After a joint claim with Z-Pentest it began posting
  intrusions it claimed alone.
ics_kill_chain_stage: unknown
