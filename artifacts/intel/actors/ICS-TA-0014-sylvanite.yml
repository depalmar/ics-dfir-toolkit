notes: >-
  Every alias is an overlap Dragos lists; none is equated. The press-release
  subtitle calls SYLVANITE 'linked to VOLTZITE/Volt Typhoon operations', a phrase
  that also does not equate. The reporters conflict over UNC3236: Dragos lists it
  as a SYLVANITE overlap, AA24-038A lists it as another name for Volt Typhoon.
  The Stage 1 label in trade press (Industrial Cyber, Cyber Magazine) is a lead
  only; the full Year in Review report was not read. The edge products exploited
  are IT edge devices, not catalogued OT platforms, so no platform id is listed.
