reported_by: [Dragos]
link_confidence: medium
stated_confidence: >-
  Dragos gives no confidence language. It states AZURITE 'moves laterally to
  engineering workstations where it conducts interactive operations to identify
  and exfiltrate alarm data, PLC configurations, HMI data, and process
  information', and lists 'Assessed to share tasking and targeting objectives with
  VOLTZITE'.
state_nexus: >-
  None stated. Dragos 'does not corroborate nor conduct political attribution to
  threat activity'.
motivation: prepositioning
summary: >-
  Dragos cluster named in the 2026 Year in Review that goes after OT engineering
  workstations. It gets in through internet-facing VPNs, firewalls and
  remote-access gateways (Ivanti, Fortinet, Cisco, GIS, F5) and hides behind
  networks of compromised SOHO routers and NAS devices. It then steals alarm data,
  PLC configurations, HMI data and process information. Dragos reads the focus on
  'how industrial processes operate, what triggers alarms, and how control loops
  are structured' as building knowledge for OT-specific disruptive capability.
  Motivation follows Dragos's wording: 'treat any AZURITE presence in an OT
  environment as active prepositioning for future destructive operations'.
ics_kill_chain_stage: unknown
stage_basis: >-
  The Dragos pages read give no stage label. Trade press reports Dragos calling
  AZURITE a Stage 2 adversary; that is not used here.
platforms: [ICS-0010]
malware: []
incidents: []
tradecraft:
  - "Exploit (Dragos): 'Exploits internet-facing Ivanti, Fortinet, Cisco, GIS, and F5 assets'."
  - "Hands-on operator (Dragos): 'interactive operations to identify and exfiltrate alarm data, PLC configurations, HMI data, and process information' from engineering workstations, over 'RDP access to engineering workstations'."
  - "Hands-on operator (Dragos): 'Heavy use of LOTL techniques and strong operational security practices'; 'Slow and steady reconnaissance to evade internal detection'."
  - "Tools (Dragos): web shells 'Chopper, AntSword, SuperShell, and Godzilla'; 'SOCKS/SOCKS5 tunneling for C2'."
  - "Infrastructure (Dragos): 'Compromised SOHO routers and NAS devices incorporated into adversary ORB networks'; 'Purpose-built VPS infrastructure for C2 and exfiltration'."
sectors: [manufacturing, automotive, electric, oil and gas, pharmaceutical, defense industrial base, government]
