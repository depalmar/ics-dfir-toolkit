notes: >-
  The overlap list differs by source. The threat page names APT35, UNC1549 and
  Tortoiseshell. A Dragos executive-briefing PDF, seen only as a search excerpt,
  also names 'Imperial Kitten'. That is left out of aliases until the PDF is read
  directly. The PYROXENE page subtitle repeats AZURITE's subtitle word for word
  ('Targets OT engineering workstations to exfiltrate operational data...'). It
  looks like a template error and is not relied on. PARISITE is another Dragos
  group with no record in this toolkit yet. The year of the June wiper deployment
  is inferred from the report's 2025 scope; the press release says only 'in June'.
  ICS-MAL-0016 (GigaWiper / BLUERABBIT) is listed because Dragos's PYROXENE page
  states the group 'Builds custom RAT malware (MINIBIKE) and destructive wiper
  malware (BLUERABBIT)' and Microsoft states GigaWiper is tracked by GTIG and
  Binary Defense as BLUERABBIT (both quoted on that record); the tradecraft line
  saying no malware id was assigned predates that record (consistency audit,
  2026-11-08).
