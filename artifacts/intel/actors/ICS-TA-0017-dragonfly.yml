notes: >-
  The reporters frame motivation differently. Symantec's page summary calls
  Dragonfly a 'cyber espionage group' and emphasises sabotage potential. DOJ
  describes persistent access for future disruption; the record follows DOJ. Symantec
  declined to attribute and flagged possible false flags ('Some code strings in
  the malware were in Russian. However, some were also in French'). The Russian
  attribution here rests on DOJ and DHS/FBI. TA18-074A does not use the name
  Dragonfly for the actors ('Russian government cyber actors'); it points to
  Symantec's report for the same campaign. The December 2025 Poland attacks
  (ICS-INC-0008) have three divergent attributions: CERT Polska says this cluster,
  by infrastructure overlap and without confidence wording; ESET says Sandworm,
  medium confidence, wiper only (ICS-TA-0001); Dragos says ELECTRUM (ICS-TA-0002).
  None is preferred here. CERT Polska's full PDF report was not read; only its
  summary post. Havex's OPC DA scanning is the malware
  record's concern (ICS-MAL-0002). No platform id is listed: the sources name no
  specific controller family.
