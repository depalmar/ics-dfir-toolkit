    url: https://cloud.google.com/blog/topics/threat-intelligence/triton-attribution-russian-government-owned-lab-most-likely-built-tools/
    accessed: "2026-11-08"
    kind: vendor
    quote: "FireEye Intelligence assesses with high confidence that intrusion activity that led to deployment of TRITON was supported by the Central Scientific Research Institute of Chemistry and Mechanics (CNIIHM; a.k.a. ЦНИИХМ), a Russian government-owned technical research institution located in Moscow."
    read: direct
  - title: US Treasury - Sanctions Russian Government Research Institution Connected to the Triton Malware (23 October 2020)
    url: https://home.treasury.gov/news/press-releases/sm1162
    accessed: "2026-11-08"
    kind: government
    quote: "In August 2017, a petrochemical facility in the Middle East was the target of a cyber-attack involving the Triton malware. This cyber-attack was supported by the** State Research Center of the Russian Federation FGUP Central Scientific Research Institute of Chemistry and Mechanics (TsNIIKhM)**, a Russian government-controlled research institution that is responsible for building customized tools that enabled the attack."
    read: direct
  - title: US DOJ - Four Russian Government Employees Charged in Two Historical Hacking Campaigns Targeting Critical Infrastructure Worldwide (24 March 2022)
    url: https://www.justice.gov/archives/opa/pr/four-russian-government-employees-charged-two-historical-hacking-campaigns-targeting-critical
