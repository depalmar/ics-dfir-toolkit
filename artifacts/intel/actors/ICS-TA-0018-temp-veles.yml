    read: direct
notes: >-
  New cluster record (id added by this stream). The registry allocated
  ICS-TA-0004 as 'XENOTIME / TEMP.Veles (TRITON)'. The two names belong to
  different reporters, and neither equates them, so they are kept apart.
  link_confidence is medium: the TEMP.Veles-to-TRITON link rests on Mandiant
  alone. The US Government statements corroborate the TsNIIKhM nexus for the
  attack, not Mandiant's cluster boundary. The Treasury quote keeps the page's
  stray '**' markup as rendered. The '87.245.143.140' address is quoted from
  Mandiant as context, not as an indicator; indicators belong in an ICS-IOC set
  parsed from the publisher's file. 'Mandiant' is FireEye Intelligence's
  publication, now hosted on Google Cloud.
