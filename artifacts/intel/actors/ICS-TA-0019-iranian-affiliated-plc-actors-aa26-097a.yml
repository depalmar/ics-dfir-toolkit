notes: >-
  New cluster record (id added by this stream). AA26-097A deliberately leaves the
  group unnamed and treats CyberAv3ngers as a precedent ('similar activity'), not
  as the actor. Merging the two would compute attribution the reporter did not
  make. link_confidence is medium: one publication, though multi-agency.
  Platform mapping follows the advisory's device list. Micro850 has no catalogue
  entry; CompactLogix maps to ICS-0001, BMX P34/Modicon M340 to ICS-0005, S7-1200
  to ICS-0003. The modems are not identified by class or vendor in the
  technical section, so no gateway platform is listed. Indicators belong in an
  ICS-IOC set parsed from CISA's STIX file, not here.
