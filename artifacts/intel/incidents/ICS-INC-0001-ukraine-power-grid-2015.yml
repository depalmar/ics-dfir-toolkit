notes: >-
  Conflict: CISA counts approximately 225,000 customers; ESET says around 250,000 households. CISA's team
  "was not able to independently review technical evidence"; the account rests on interviews. Gaps the
  sources leave open: how the actors reached the distribution management / SCADA environment beyond VPN
  use with stolen credentials, and which ICS client software was used. KillDisk has no registry malware
  id. The E-ISAC/SANS analysis was not read in this pass. ICS-TA-0001 (DOJ, Sandworm Team labels) and
  ICS-TA-0002 (Dragos ELECTRUM) are separate clusters from separate reporters and are both listed, not
  merged.
