notes: >-
  Gaps: none of the sources read describes initial access or the path from the corporate network to the
  substation control environment. ESET's 2017 blog first says involvement "is yet to be confirmed" and
  later "highly probable"; the US Government's 2021 attribution statement is the firmest link. The
  one-hour outage of part of Kyiv is ESET's statement citing Reuters. CVE-2015-5374 is listed because the
  framework carried a module for it; no source read confirms the module was run against a relay in this
  incident (see exploitation.yml). IEC 60870-5-101 has no registry protocol id. The Dragos CRASHOVERRIDE
  report itself was not read in this pass.
