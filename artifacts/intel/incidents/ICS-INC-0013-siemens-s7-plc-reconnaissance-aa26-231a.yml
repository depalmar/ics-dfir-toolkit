notes: >-
  No actor record was created and none is linked. AA26-231A names no group, nationality, sponsor or motivation, and
  calls the actors only "threat actors". Linking it to ICS-TA-0019 or ICS-INC-0009 (AA26-097A, which also names the
  S7-1200) would compute attribution no source makes. Siemens SSB-104599 lists both advisories as successive
  developments but does not tie their actors together. No malware record either: the "AI-generated exploitation
  scripts" built on snap7 have no name, and snap7 is a legitimate open-source library. The advisory names no CVE,
  only "various critical and high severity known vulnerabilities", so the KEV watch has nothing to map. S7-200
  has no platform record. The protocol is S7comm (ICS-PROTO-0002) because the advisory names S7comm; S7comm-plus
  is not mentioned. The quote "Threat actors are actively targeting the following Siemens PLC models" ends in a
  colon on the page. The file names snap7.dll and python-snap7 are set as inline code on the page. The advisory
  publishes no indicators, so no ICS-IOC set exists. Its hardening and detection guidance is already in
  artifacts/hardening/siemens-s7.yml and baseline.yml.
