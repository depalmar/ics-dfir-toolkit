id: ICS-IOC-0002
title: ESET - DynoWiper update (Poland energy sector, December 2025) - file and network indicators
publisher: ESET Research
published: '2026-01-30'
page_url: https://www.welivesecurity.com/en/eset-research/dynowiper-update-technical-analysis-attribution/
