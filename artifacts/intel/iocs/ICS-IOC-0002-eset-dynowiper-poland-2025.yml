accessed: '2026-11-08'
actors:
- ICS-TA-0001
malware:
- ICS-MAL-0013
incidents:
- ICS-INC-0008
staleness: >-
  ESET: "All three samples were deployed on the same day – December 29th, 2025"; the attackers tried rsocx "In
  early December 2025" and Rubeus "In early stages of the attack". The SOCKS5 server was first seen 2024-10-27 and, per ESET, "was likely
  compromised", so it belongs to a third party. ESET adds that Sandworm rarely reuses a known sample: "We rarely see
  Sandworm attempt to deploy a destructive malware sample that was used in an earlier attack (for example, one with
  a known hash) or one that is already detected at the time of deployment." Use the hashes for retrospective
  searches, not as a prevention control. Attribution in actors is ESET's: "We attribute DynoWiper to Sandworm with
  medium confidence".
