staleness: >-
  Published 12 June 2017 for the malware used against a Ukrainian transmission substation in December 2016; the
  sample hash lists were completed in 2019. ESET's own warning on the C&C addresses: "Most of the servers with these
  IP addresses were part of Tor network, which means that the use of these indicators could result in false
  positives." Treat the addresses as historical context only. The hashes identify the 2016 samples; they do not
  cover Industroyer2 (2022).
