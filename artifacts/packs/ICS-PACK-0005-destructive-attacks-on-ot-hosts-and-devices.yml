detect:
  - id: destruct-backup-or-shadow-copy-deleted
    title: Shadow copies, the backup catalog or system-state backups deleted, or SDelete run, on an EWS, HMI or SCADA server
    type: check
    check: windows_event_query
    args:
      channel: Microsoft-Windows-Sysmon/Operational
      event_id: 1
      commands: [vssadmin delete shadows, wbadmin delete catalog, wbadmin delete systemstatebackup, sdelete.exe, sdelete64.exe]
    tier: likely
    evidence_class: process
    datasources: [ICS-DS-0006]
    attack: [T0809, T1490]
    rules: [01-engineering-workstations/ews_hmi_shadow_copy_or_backup_deleted.yml]
    notes: >-
      MITRE T0809 covers destroying backups "vital to recovery"; CERT Polska
      recovered "vssadmin delete shadows" from the Poland intrusion. Does not
      see EKANS, which removes shadow copies through WMI from its own code.

  - id: destruct-file-shredding-blocked
    title: Sysmon blocked file shredding on an EWS, HMI or SCADA server
    type: check
    check: windows_event_query
    args:
      channel: Microsoft-Windows-Sysmon/Operational
      event_id: 28
    tier: likely
    evidence_class: filesystem
    datasources: [ICS-DS-0006]
    attack: [T0809]
    rules: [01-engineering-workstations/ews_hmi_file_shredding_blocked.yml]
    notes: >-
      Only where the Sysmon configuration has a FileBlockShredding filter.
      Whether DynoWiper, PathWiper or GigaWiper trip it was not tested; no
      event is not evidence that no wiper ran.

  - id: destruct-file-overwrite-or-rename-burst
    title: One process creating, overwriting, renaming or deleting files across many directories within minutes
    type: check
    check: file_activity_burst
    args:
      channel: Microsoft-Windows-Sysmon/Operational
      event_ids: [11, 23, 26]
      group_by: [Computer, ProcessGuid]
    tier: likely
    evidence_class: filesystem
    datasources: [ICS-DS-0006]
    attack: [T0809]
    notes: >-
      The count-and-window logic Sigma cannot express. Recorded patterns:
      DynoWiper overwrites then deletes files on fixed and removable drives,
      skipping system folders (CERT Polska, ESET); GigaWiper's command 3
      encrypts files and renames them .candy (Microsoft); EKANS appends a
      random five-letter suffix to each encrypted file's extension (Dragos);
      Industroyer's wiper overwrites ABB and SCL configuration files (ESET,
      ICS-0014). Thresholds are a site baseline, not a published value.

  - id: destruct-disk-structures-destroyed
    title: Master boot record, partition table or NTFS metadata overwritten on a host that no longer boots
    type: check
    check: disk_layout_compare
    tier: confirmed
    evidence_class: filesystem
    attack: [T1561.001, T0809]
    notes: >-
      Run on a forensic image of a failed host, never on a running HMI.
      PathWiper overwrites the MBR and NTFS metadata files ($MFT, $MFTMirr,
      $LogFile, $Boot, $Bitmap, $TxfLog, $Tops, $AttrDef) with random data
      after trying to dismount volumes (Talos); GigaWiper removes partition metadata with
      IOCTL_DISK_CREATE_DISK and overwrites raw disk content (Microsoft). An
      image with an intact layout has not been shown clean; file-level wiping
      leaves the layout alone.

  - id: destruct-scheduled-task-on-ews-hmi
    title: Scheduled task created on an EWS, HMI or SCADA server
    type: check
    check: windows_event_query
    args:
      channel: Security
      event_id: 4698
    tier: possible
    evidence_class: persistence
    datasources: [ICS-DS-0006]
    attack: [T1053.005]
    rules: [01-engineering-workstations/ews_hmi_scheduled_task_created.yml]
    notes: >-
      Industroyer2 and CaddyWiper (ESET), TANKTRAP's CaddyWiper tasks
      (Mandiant), the Poland GPO task that deletes itself (CERT Polska) and
      GigaWiper's "OneDrive Update" (Microsoft) all ran this way. Likely when
      the task's command points at a file just copied from a share or into
      C:\Windows, or when the same task appears on many OT hosts at once.

  - id: destruct-ot-service-terminated
    title: HMI, SCADA, historian or licensing service terminated unexpectedly
    type: check
    check: windows_event_query
    args:
      channel: System
      event_id: 7034
      provider: Service Control Manager
    tier: possible
    evidence_class: process
    datasources: [ICS-DS-0006]
    attack: [T0881]
    rules: [01-engineering-workstations/ews_hmi_service_terminated_unexpectedly.yml]
    notes: >-
      Sees EKANS-style process kills of service processes whatever tool did
      them. Likely when several OT services on several hosts terminate within
      minutes (ICS-HUNT-0013).

  - id: destruct-service-stop-command
    title: net stop, sc stop or disable, taskkill or Stop-Service / Stop-Process on an EWS, HMI or SCADA server
    type: check
    check: windows_event_query
    args:
      channel: Microsoft-Windows-Sysmon/Operational
      event_id: 1
      commands: [net stop, sc stop, sc config start= disabled, taskkill, Stop-Service, Stop-Process]
    tier: possible
    evidence_class: process
    datasources: [ICS-DS-0006]
    attack: [T0881]
    rules: [01-engineering-workstations/ews_hmi_service_or_process_stop_command.yml]

  - id: destruct-host-restart-or-crash
    title: Restart initiated by an unexpected process, or an unexpected shutdown or bugcheck, on an EWS, HMI or SCADA server
    type: check
    check: windows_event_query
    args:
      channel: System
      event_ids: [1074, 41, 6008, 1001]
    tier: possible
    evidence_class: system-logs
    datasources: [ICS-DS-0006]
    attack: [T0816]
    rules: [01-engineering-workstations/ews_hmi_restart_or_unexpected_shutdown.yml]
    notes: >-
      DynoWiper version A ends with ExitWindowsEx (CERT Polska); GigaWiper
      forces a zero-delay reboot and has a BSOD command (Microsoft). Likely
      when it follows any other detection in this pack on the same host.

  - id: destruct-script-host-on-ews-hmi
    title: Windows Script Host runs a script on an EWS, HMI or SCADA server
    type: check
    check: windows_event_query
    args:
      channel: Microsoft-Windows-Sysmon/Operational
      event_id: 1
      images: [wscript.exe, cscript.exe]
    tier: possible
    evidence_class: process
    datasources: [ICS-DS-0006]
    attack: [T0853]
    rules: [01-engineering-workstations/ews_hmi_windows_script_host_execution.yml]
    notes: >-
      PathWiper's loader was WScript running C:\WINDOWS\TEMP\uacinstall.vbs
      (Talos); Sandworm's MicroSCADA attack began with wscript.exe running
      lun.vbs from an ISO (Mandiant).

  - id: destruct-ied-ftp-session
    title: FTP session to a relay or RTU from outside HOME_NET, or between OT hosts
    type: network
    tier: possible
    evidence_class: network
    datasources: [ICS-DS-0002, ICS-DS-0001]
    attack: [T0809, T0816, T0812]
    rules: [02-ot-network/relay_and_rtu_service_sessions.rules]
    notes: >-
      CERT Polska: the attacker used a Relion 650 v1.1 built-in account with
      default credentials over FTP "to delete files essential for device
      operation", so the relay shut down and could not restart. sids 9000017
      and 9000018. Likely when the source is not the engineering host or the
      session falls outside disturbance-record readout or approved work; read
      Zeek ftp.log for the commands.

  - id: destruct-rtu-reset-after-transfer
    title: RTU500 event log records a manual reset or RTU restart
    type: log_regex
    tier: possible
    evidence_class: audit-trail
    datasources: [ICS-DS-0013]
    pattern: 'Manual Reset|Gateway/RTU restarted'
    attack: [T0816]
    notes: >-
      Event texts from the RTU560 event-log excerpt CERT Polska printed (5110
      "Manual Reset", 5160 "Gateway/RTU restarted"), recorded in ICS-0014;
      confirm the forwarded format before relying on the pattern. Likely when
      it follows a login by a default account or a firmware transfer
      (ICS-PACK-0006) within minutes.
