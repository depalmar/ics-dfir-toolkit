# Detection pack ICS-PACK-0005
# Schema: ../schema/pack.schema.json
# Research notes: docs/research/2026-11-08/detections-round3.md
#
# Detections of type "check" name an evaluation step for the triage engine,
# which is not built yet (docs/ROADMAP.md); until then they are manual steps,
# and the Sigma and Suricata files linked in "rules" are what can be deployed
# today. A detection whose evidence was not collected is not evaluated.

id: ICS-PACK-0005
name: Destructive attacks on engineering workstations, HMIs, SCADA servers and substation devices
platforms: [ICS-0010, ICS-0011, ICS-0012, ICS-0014]
actors: [ICS-TA-0001, ICS-TA-0002, ICS-TA-0016, ICS-TA-0017]
malware: [ICS-MAL-0004, ICS-MAL-0006, ICS-MAL-0012, ICS-MAL-0013, ICS-MAL-0014, ICS-MAL-0015, ICS-MAL-0016]
incidents: [ICS-INC-0002, ICS-INC-0004, ICS-INC-0008]
summary: >-
  The traces destructive tools leave on the Windows hosts that run and
  engineer the process, and on the relays and RTUs beside them. The recorded
  families overwrite and delete files (DynoWiper, LazyWiper, PathWiper,
  GigaWiper's ransomware-styled command, Industroyer's wiper module), destroy
  disk structures (PathWiper's MBR and NTFS metadata, GigaWiper's partition
  tables and raw disks), stop or kill the processes operators depend on
  (EKANS, Industroyer2), are launched by scheduled tasks pushed through group
  policy (Industroyer2 and CaddyWiper, TANKTRAP, the December 2025 Poland
  GPO), and finish with a forced restart or crash (DynoWiper, GigaWiper). In
  Poland the same operation deleted Relion relay system files over FTP with a
  built-in account and reset RTUs after loading corrupted firmware (CERT
  Polska; the firmware side is ICS-PACK-0006). EKANS deletes shadow copies
  through WMI and most wipers start no Windows tool at all, so the command-line
  detections here catch the hands-on and scripted routes; the file, restart
  and service-termination detections are what see the malware itself. A host
  already wiped may hold nothing: work from forwarded logs and EDR.
confidence: high
