# ICS protocol identity record
# ICS-PROTO-0020 - MELSEC SLMP / MC protocol
# Research notes: docs/research/2026-11-08/datasources.md
# Identity only: operations (commands and their effects) are deliberately omitted.

id: ICS-PROTO-0020
name: MELSEC SLMP / MC protocol
slug: slmp
aliases:
  - SLMP (Seamless Message Protocol)
  - MC protocol (MELSEC Communication protocol)
spec_owner: Mitsubishi Electric (MC protocol); SLMP is published by the CC-Link Partner Association (CLPA) - CLPA ownership not verified in this round
transport:
  - layer: tcp
    notes: >-
      Mitsubishi's SLMP Reference Manual describes the communication procedure
      for both TCP/IP and UDP/IP (chapter 3, read 2026-11-08); no default port
      was found in the pages read, so no port is given.
  - layer: udp
authentication:
  native: none
  detail: >-
    Not verified. The only statement found is a third-party guide (NHI Mgmt
    Group, read directly) saying plain SLMP carries no strong authentication;
    only the first 30 of 242 pages of Mitsubishi's SLMP Reference Manual were
    read, and its authentication content was not. Treat as unauthenticated.
encryption: None documented in the sources read.
parsers: []
platforms: []
notes: >-
  No registry platform is a Mitsubishi controller. No open-source Zeek or
  Suricata parser for SLMP was verified in this round. The SLMP manual's table
  of contents lists a "Remote Password" command section (Lock/Unlock, section
  5.7); it was not read, and the "none" authentication value has not been
  reconciled with it. The nhimg.org guide states it was "Researched and
  written by the NHI Mgmt Group editorial team using AI tools"; it is a lead,
  not a basis for the authentication value.
confidence: low
unverified: true
sources:
  - title: SLMP Reference Manual (Mitsubishi Electric, SH-080956ENG)
    url: https://dl.mitsubishielectric.com/dl/fa/document/manual/plc/sh080956eng/sh080956engl.pdf
    accessed: "2026-11-08"
    kind: vendor
    quote: >-
      An abbreviation for the MELSEC communication protocol. This protocol is
      used to access an MC protocol-compatible device or a programmable
      controller connected to an MC protocol-compatible device from an external
      device such as a personal computer or HMI (Human Machine Interface).
    read: direct
  - title: Mitsubishi MELSEC and Omron PLC Security Guide (nhimg.org)
    url: https://nhimg.org/mitsubishi-and-omron-plc-security-guide
    accessed: "2026-11-08"
    kind: researcher
    quote: >-
      Legacy protocols such as FINS and plain SLMP carry no strong
      authentication, so anyone who can reach the port can often read or change
      data.
    read: direct
