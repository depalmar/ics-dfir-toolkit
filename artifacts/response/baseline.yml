notes: >-
  Confidence is medium for the playbook as a whole because it combines several
  authorities' guidance and two toolkit-basis items; individual steps carry their
  own basis. Platform playbooks can add vendor-specific capture and restore
  steps; only the baseline exists so far (docs/ID_REGISTRY.md). DOE CESER and
  E-ISAC response guidance and SANS ICS incident-response material were not read
