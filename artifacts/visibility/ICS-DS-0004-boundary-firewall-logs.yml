# ICS visibility data source
# ICS-DS-0004 - IT/OT boundary and DMZ firewall logs
# Research notes: docs/research/2026-11-08/datasources.md

id: ICS-DS-0004
name: IT/OT boundary and DMZ firewall logs
category: perimeter-firewall
purdue_levels: ["3", "3.5", "4"]
platforms: [ALL]
location: >-
  Generated by the firewalls between the enterprise network and the OT DMZ,
  between the DMZ and the control network, and at any direct internet or
  cellular edge; held briefly on the firewall and normally forwarded by
  syslog to a SIEM or log server.
enable: >-
  Logging of both allowed and denied sessions, and of rule changes, must be
  turned on and forwarded off the device before an incident. AA25-343A asks
  owners to restrict and monitor inbound and outbound traffic at OT perimeter
  firewalls with a default-deny policy; a firewall that logs only denies
  shows nothing about an attacker using an allowed path. Firewall time must be
  synchronised (the joint logging guidance prefers UTC and one-way time
  distribution from IT to OT).
retention: >-
  Vendor- and configuration-dependent. The joint ASD/CISA guidance notes many
  network devices have limited local storage and overwrite old logs, so
  forwarding to central storage is what preserves them.
collection:
  - method: Export firewall logs already forwarded to the SIEM or log server
    impact: passive
    description: Copies existing records.
    confidence: high
  - method: Read the firewall's local log and rule-change history through its management interface or vendor-documented export
    impact: read-only
    description: >-
      Recovers entries not yet forwarded and the current and historical
      rulesets. The firewall is network infrastructure, not a controller, but
      it is in the control path.
    safety_note: >-
      Do not change rules, reboot or upgrade the firewall during collection;
      a mistaken change can cut HMI-to-controller traffic. Export the
      configuration before anyone edits it.
    confidence: medium
events:
  - event: Inbound sessions to 44818/tcp+udp, 2222/udp, 102/tcp or 502/tcp from internet addresses, especially foreign hosting providers
    value: CISA AA26-097A reports these ports targeted on internet-facing PLCs and asks owners to search logs for them.
    attack: [T0883, T0885, T1595.002]
    basis: government
  - event: Inbound sessions to 22/tcp on modems or gateways
    value: AA26-097A reports actors deploying Dropbear SSH on victim modems for remote access through port 22.
    attack: [T1219]
    basis: government
  - event: Inbound sessions to VNC ports 5900-5910
    value: AA25-343A reports hacktivists searching for VNC on 5900 or nearby ports (5901-5910) to reach HMIs connected to live control networks.
    attack: [T0886, T1021.005, T0823]
    basis: government
  - event: Outbound sessions from OT to the internet (beaconing, unexpected protocols)
    value: AA25-343A asks owners to monitor outbound traffic patterns for anomalies such as beaconing or unexpected protocol usage.
    attack: [T0869, T1041]
    basis: government
  - event: Firewall rule or policy change entries
    value: >-
      Who opened a path and when; AA25-343A asks for regular ruleset audits.
      An unexplained rule allowing internet access to an OT host is itself an
      intrusion indicator.
    basis: government
  - event: Connections using standard protocols on non-standard ports
    value: AA25-343A asks owners to block unused high ephemeral ports and monitor for attempted connections using standard protocols on non-standard ports.
    basis: government
attack_data_components: [DC0078, DC0082, DC0051, DC0053]
gaps:
  - Shows sessions that crossed the firewall only; lateral movement inside a flat control network is invisible.
  - No payload - cannot show what a session did to a controller.
  - Many deployments log denies only, or sample; an attacker on an allowed path (vendor VPN, IT-to-OT data path) leaves only an "allow" that may not be logged.
  - NAT can replace the internal host address with the firewall's own (this project's caution).
  - Direct internet or cellular paths that bypass the boundary firewall (third-party-installed modems, VNC exposed by a contractor) never appear; AA25-343A highlights connections set up by third parties.
  - Vendor log formats were not read in this round, so field names are not recorded here.
confidence: high
sources:
  - title: CISA AA25-343A - Pro-Russia Hacktivists Conduct Opportunistic Attacks Against US and Global Critical Infrastructure
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Restrict and monitor both inbound and outbound traffic at OT perimeter
      firewalls. Configure OT perimeter firewalls to enforce a default-deny
      policy for all traffic. Asset owners should explicitly permit authorized
      destinations and protocols based on operational requirements.
    read: direct
  - title: CISA AA25-343A, VNC targeting
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Threat actors typically search for these services on the default port
      `5900` or other nearby ports (`5901-5910`). Their goal is to gain remote
      access to HMI devices connected to live control networks.
    read: direct
  - title: CISA AA25-343A, non-standard ports
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-343a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Block all unused high ephemeral ports and monitor for attempted connections
      using standard protocols on non-standard ports
    read: direct
  - title: CISA AA26-097A - Iranian-Affiliated Cyber Actors Exploit Programmable Logic Controllers Across US Critical Infrastructure
    url: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
    accessed: "2026-11-08"
    kind: government
    quote: >-
      In one reported instance, the actors utilized Dropbear Secure Shell (SSH)
      software on victim modems to enable them to gain remote access through port
      `22`
    read: direct
  - title: Best practices for event logging and threat detection (ASD's ACSC with CISA, FBI, NSA and partners, August 2024)
    url: https://www.cyber.gov.au/sites/default/files/2024-08/best-practices-for-event-logging-and-threat-detection.pdf
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Many commercially available network infrastructure devices have limited
      local storage. Forwarding event logs to a centralised and secure storage
      capability prevents the loss of logs once the local device’s storage is
      exhausted.
    read: direct
  - title: Best practices for event logging and threat detection, timestamp consistency
    url: https://www.cyber.gov.au/sites/default/files/2024-08/best-practices-for-event-logging-and-threat-detection.pdf
    accessed: "2026-11-08"
    kind: government
    quote: >-
      Timesharing should be unidirectional. The OT environment should sychronise
      time sync with the IT environment and not the other way around.
    read: direct
  - title: MITRE ATT&CK Enterprise T1595.002 Active Scanning - Vulnerability Scanning, Detection Strategy DET0867, analytic AN1999
    url: https://attack.mitre.org/techniques/T1595/002/
    accessed: "2026-11-08"
    kind: standard
    quote: >-
      Monitor network data for uncommon data flows.
    read: direct
  - title: MITRE ATT&CK ICS T0823 Graphical User Interface, Detection Strategy DET0772, analytic AN2251
    url: https://attack.mitre.org/techniques/T0823/
    accessed: "2026-11-08"
    kind: standard
    quote: >-
      Real-time monitoring identifies Virtual Network Computing (VNC) or
      proprietary remote console sessions to embedded Human-Machine Interface
      (HMI) panels or operator terminals from IP addresses outside the approved
      Network Management System (NMS) Classless Inter-Domain Routing (CIDR)
      subnet, where the sessions access Industrial Control System (ICS) control
      interfaces with physical-plant impact.
    read: direct
  - title: MITRE ATT&CK ICS T0869 Standard Application Layer Protocol, Detection Strategy DET0799, analytic AN2223
    url: https://attack.mitre.org/techniques/T0869/
    accessed: "2026-11-08"
    kind: standard
    quote: >-
      Near-real-time connection monitoring identifies an embedded field device or
      gateway initiating outbound connections on standard application-layer
      protocol ports to destinations outside the expected Industrial Control
      System (ICS) communication baseline.
    read: direct
  - title: MITRE ATT&CK Enterprise T1041 Exfiltration Over C2 Channel, Detection Strategy DET0348, analytic AN0988
    url: https://attack.mitre.org/techniques/T1041/
    accessed: "2026-11-08"
    kind: standard
    quote: >-
      Identifies suspicious outbound traffic volume mismatches from processes that
      typically do not generate network activity, particularly over C2 protocols
      like HTTPS, DNS, or custom TCP/UDP ports, following file or data access.
    read: direct
