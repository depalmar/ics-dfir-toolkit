# ICS visibility data source
# ICS-DS-0006 - Windows Security, Sysmon and PowerShell logs on EWS / HMI hosts
# Research notes: docs/research/2026-11-08/datasources.md

id: ICS-DS-0006
name: Windows Security, Sysmon and PowerShell logs on EWS / HMI hosts
category: host-windows
purdue_levels: ["2", "3"]
platforms: [ICS-0010, ICS-0011, ICS-0007, ICS-0012, ICS-0015]
location: >-
  On each Windows engineering workstation, HMI and SCADA server: the Security
  event log (Microsoft-Windows-Security-Auditing provider), the Sysmon log
  "Applications and Services Logs/Microsoft/Windows/Sysmon/Operational", and
  the PowerShell operational logs (PowerShellCore/Operational for PowerShell 7;
  Microsoft's decryption example on the same page queries
  Microsoft-Windows-PowerShell/Operational for event 4104). Copies
  exist off-host only where Windows Event Forwarding or a SIEM agent was set
  up.
enable: >-
  Process creation (4688) needs the "Audit Process Creation" subcategory, and
  its command line needs the policy "Administrative Templates\System\Audit
  Process Creation\Include command line in process creation events" - by
  default the Process Command Line field is empty. Sysmon must be installed
  with a configuration (its network-connection event is disabled by default).
  PowerShell script block logging must be turned on ("Turn on PowerShell
  Script Block Logging" under Administrative Templates -> PowerShell Core for
  PowerShell 7; Windows PowerShell 5.1 is configured as described in
  about_Logging, not read here). Microsoft recommends Protected Event Logging
  with script block logging. Confirm with the HMI/SCADA vendor that agents
  and audit policy changes are supported on qualified systems (this project's
  caution).
retention: >-
  Local logs are kept only up to their configured size; the joint ASD/CISA
  guidance warns many systems overwrite old logs when their storage
  allocation is exhausted and that default retention is often insufficient.
  Forward to central storage.
collection:
  - method: Export events already forwarded to the SIEM or Windows Event Collector
    impact: passive
    description: Copies existing records; no action on the host.
    confidence: high
  - method: Export the live .evtx logs (Security, Sysmon/Operational, PowerShell operational) from the host with built-in Windows tools
    impact: read-only
    description: >-
      Reads the host's own logs. The host is an OT asset: an HMI may be the
      operators' only view of the process.
    safety_note: >-
      Agree timing with operations; do not reboot, log off the operator
      session, install software or run heavy collection on an HMI that is in
      use. Collect from a redundant or standby HMI first where one exists.
    confidence: medium
events:
  - event: Security 4688 - A new process has been created (New Process Name, Creator Process Name, Process Command Line, Token Elevation Type, Mandatory Label)
    value: >-
      Every program started on the EWS/HMI, by which account and parent;
      with command-line auditing on, the arguments too. Reveals engineering
      tools started at odd hours, scripts and LOTL binaries.
    attack: [T0807, T0840, T0847]
    basis: vendor
  - event: Security 4624 - An account was successfully logged on (correlate by Logon ID with 4688)
    value: Logons to the EWS/HMI; the Logon ID links a session to the processes it started.
    attack: [T0859, T1078.001, T1563]
    basis: vendor
  - event: Security 4778 - A session was reconnected to a Window Station (Account Name, Logon ID, Session Name, Client Name, Client Address; needs the "Audit Other Logon/Logoff Events" subcategory)
    value: >-
      Reconnections to an existing Remote Desktop (RDP-Tcp#N) or console session, with the client name and address; the Logon ID ties the session back to its 4624. A reconnect to an operator's session from a client with no matching logon is the session takeover MITRE's analytic for remote service session hijacking looks for.
    attack: [T1563]
    basis: vendor
  - event: Sysmon Event ID 1 - Process creation (full command line, parent process, file hash per HashType, ProcessGUID)
    value: Process start with full command line, parent and file hash; ProcessGuid survives PID reuse for correlation.
    attack: [T0807, T0819, T0840, T0847, T1560]
    basis: vendor
  - event: Sysmon Event ID 3 - Network connection (disabled by default)
    value: Which process on the EWS/HMI opened each TCP/UDP connection - ties a session to a PLC (for example to 44818, 102 or 502) to the program that made it.
    attack: [T0869, T1041]
    basis: vendor
  - event: Sysmon Event ID 11 - FileCreate
    value: Files created or overwritten, including dropped tools and new or modified project files.
    attack: [T0873, T0873.001, T1491.001, T1560]
    basis: vendor
  - event: Sysmon Event ID 22 - DNSEvent (DNS query)
    value: Per-process DNS lookups, showing which programs on an OT host looked up external infrastructure.
    attack: [T0869]
    basis: vendor
  - event: PowerShell 4104 (script block logging) in PowerShellCore/Operational or Microsoft-Windows-PowerShell/Operational
    value: The content of PowerShell scriptblocks processed on the host, whether interactive or automated.
    attack: [T0853]
    basis: vendor
  - event: Use of event-log enumeration such as Get-EventLog security -instanceid 4624 or wevtutil
    value: The joint ASD/CISA guidance reports Volt Typhoon enumerating logons this way; seeing it on an EWS suggests an intruder mapping accounts.
    basis: government
  - event: Unexpected clearing of logs
    value: Listed by the joint ASD/CISA guidance as anomalous behaviour; on an OT host it should be treated as an incident until explained.
    attack: [T0872]
    basis: government
  - event: Security 4698 - A scheduled task was created (SubjectUserName, TaskName, TaskContent; needs the "Audit Other Object Access Events" subcategory)
    value: >-
      Every new scheduled task with its account and full XML, including the command it runs. Microsoft recommends monitoring all task creation on critical computers; Industroyer2, CaddyWiper (via group policy), the December 2025 Poland GPO and GigaWiper were all launched or persisted this way (ICS-PACK-0005).
    attack: [T1053.005]
    basis: vendor
  - event: System 7034 (Service Control Manager) - The <service> service terminated unexpectedly; 7036 - The <service> service entered the stopped state
    value: >-
      Which services stopped, and whether they stopped in order (7036) or died (7034). Several HMI, SCADA, historian or licensing services terminating within minutes is the pattern of ICS-aware process killing such as EKANS (ICS-HUNT-0013).
    attack: [T0881, T0814, T1499]
    basis: vendor
  - event: System 1074 (User32) - The process <Process Name> has initiated the restart of computer <Computer Name> on behalf of user <Domain User> (reason, reason code, shutdown type)
    value: >-
      Which process and account asked for a restart or power-off. A restart requested by an unexpected process on an HMI or EWS, outside patching, needs an owner; GigaWiper and DynoWiper version A restart the host after wiping.
    attack: [T0816]
    basis: vendor
  - event: System 41 (Kernel-Power), 6008 (EventLog) and 1001 (WER-SystemErrorReporting) - rebooted without cleanly shutting down; previous shutdown was unexpected; rebooted from a bugcheck
    value: >-
      Unexpected restarts and crashes, which Microsoft separates from normal reboots (1074 followed by 13 and 6009). Without a power or hardware cause, a crash of an OT host is a lead; GigaWiper has a command that forces a BSOD.
    attack: [T0816]
    basis: vendor
  - event: Sysmon Event ID 6 - Driver loaded (hashes and signature information)
    value: >-
      Every driver load with its hash and signer. AA22-103A asks owners to watch for unusual drivers, especially the ASRock AsrDrv103.sys driver INCONTROLLER's tool exploits.
    attack: [T0866, T0851, T1014, T1553.002, T1561.001]
    basis: vendor
  - event: Sysmon Event ID 7 - Image loaded (disabled by default; must be configured)
    value: >-
      Which process loaded which DLL. Configured narrowly, it shows snap7.dll loaded by scripts that AA26-231A reports masquerading as OT monitoring tools.
    attack: [T0834, T0849, T0874, T1014]
    basis: vendor
  - event: Sysmon Event ID 10 - ProcessAccess (Microsoft advises enabling it only with filters that remove expected accesses)
    value: >-
      Which process opened another process. Microsoft states it enables detection of tools that read Lsass.exe memory to steal credentials; it exists only where the Sysmon configuration selected it before the incident.
    attack: [T1003.001]
    basis: vendor
  - event: Sysmon Event ID 23 (FileDelete, file archived) and 26 (FileDeleteDetected)
    value: >-
      File deletions per process; with Event ID 11, the raw material for spotting a process that overwrites and deletes files across many directories, as the recorded wipers do (ICS-PACK-0005).
    attack: [T0809]
    basis: vendor
  - event: Sysmon Event ID 28 - FileBlockShredding (only where the configuration includes the filter)
    value: >-
      Sysmon detected and blocked file shredding, as by SDelete, which MITRE names as a Data Destruction tool. Whether a given wiper trips it was not tested.
    attack: [T0809]
    basis: vendor
  - event: Security 6416 - A new external device was recognized by the System (Device ID, Device Name, Class ID, Class Name, Vendor IDs; needs the "Audit PNP Activity" subcategory, Windows 10 / Server 2016 and later)
    value: >-
      When a USB disk, portable device or CD/DVD drive arrived on an EWS, HMI or
      SCADA host, with its device instance path. Microsoft's own use case is a
      USB stick attached to a critical server "which is typically not allowed".
      Removable media carried Stuxnet to non-networked engineering hosts and an
      ISO attached as a virtual CD-ROM started Sandworm's 2022 MicroSCADA attack
      (ICS-HUNT-0019). Whether an ISO inserted into an existing virtual drive
      raises 6416 is not documented.
    attack: [T0847, T1091]
    seen_in: [Stuxnet, Sandworm MicroSCADA 2022]
    basis: vendor
  - event: Security 4656 and 4663 under the "Audit Removable Storage" subcategory - handle requested and object accessed on a removable storage device
    value: >-
      Which files were written to, read from or executed from removable
      storage, for all objects without a SACL. Microsoft recommends it because
      "malicious software very often uses removable devices as a method to get
      into the system".
    attack: [T0847, T1091]
    basis: vendor
  - event: Sysmon Event ID 12 (registry object added or deleted) and 13 (registry value set) - TargetObject, Details
    value: >-
      Service and autostart registry changes, including a new driver service
      under HKLM\SYSTEM\CurrentControlSet\Services; Stuxnet registered its
      MrxCls boot-start driver and MrxNet rootkit this way (ICS-PACK-0007).
      Only keys the Sysmon configuration includes are logged.
    attack: [T1543.003, T1112, T1014]
    seen_in: [Stuxnet]
    basis: vendor
tooling:
  - name: Sysmon (Microsoft Sysinternals)
    url: https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
    license: Microsoft Sysinternals EULA (proprietary freeware)
    notes: Also a built-in optional feature on Windows 11 and Windows Server 2025 per Microsoft.
  - name: CISA Logging Made Easy
    url: https://www.cisa.gov/resources-tools/services/logging-made-easy
    notes: Named by the joint ASD/CISA guidance as a no-cost log management option for small and medium organisations; licence not read.
attack_data_components: [DC0032, DC0064, DC0029, DC0067, DC0039, DC0082]
gaps:
  - Command lines are absent unless the include-command-line policy was set; Sysmon network events are off unless configured.
  - Shows what ran on the EWS/HMI, not what the engineering software then sent to a controller or whether the controller accepted it.
  - An actor using their own copy of engineering software on their own infrastructure (as CISA AA26-097A reports) never touches the plant's EWS, so nothing appears here.
  - Older or vendor-locked HMIs may not support Sysmon or current audit policy; agents may be restricted by the vendor's support terms.
  - A local administrator can clear or stop logging; only forwarded copies are trustworthy after compromise.
  - Service installation (System 7045) is not yet listed. Audit-log clearing (Security 1102) is covered by 01-engineering-workstations/ews_hmi_security_log_cleared.yml and the log-clearing entry above rather than its own entry here. Scheduled tasks (4698), unexpected service termination (7034), restarts (1074, 41, 6008, 1001) and Sysmon 6, 7, 23, 26 and 28 were added in round 4.
confidence: high
